<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Money - Checkout Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Supabase SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-1: #070b1a;
      --bg-2: #0d1025;
      --bg-3: #171238;
      --card-bg: rgba(23, 31, 55, 0.78);
      --border-color: rgba(129, 140, 248, 0.22);
      --primary: #6d5dfc;
      --primary-hover: #5546e8;
      --accent: #38bdf8;
      --cyan: #22d3ee;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    html { min-height: 100%; background: #070b1a; }
    body { 
      color: var(--text-main); 
      margin: 0; 
      padding: 16px; 
      min-height: 100vh; 
      overflow-x: hidden; 
      position: relative; 
      background: radial-gradient(circle at 15% 20%, rgba(99,102,241,0.18), transparent 28%), 
                  radial-gradient(circle at 85% 10%, rgba(56,189,248,0.12), transparent 25%), 
                  radial-gradient(circle at 50% 85%, rgba(139,92,246,0.14), transparent 35%), 
                  linear-gradient(135deg, #070b1a 0%, #0d1025 45%, #151238 100%); 
    }

    body::before {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      top: -150px;
      left: -120px;
      background: radial-gradient(circle, rgba(99,102,241,0.24) 0%, rgba(99,102,241,0.08) 38%, transparent 70%);
      filter: blur(25px);
      pointer-events: none;
      z-index: -1;
      animation: floatGlow1 10s ease-in-out infinite alternate;
    }
    body::after {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      right: -180px;
      bottom: -180px;
      background: radial-gradient(circle, rgba(56,189,248,0.18) 0%, rgba(139,92,246,0.10) 40%, transparent 72%);
      filter: blur(30px);
      pointer-events: none;
      z-index: -1;
      animation: floatGlow2 12s ease-in-out infinite alternate;
    }
    @keyframes floatGlow1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(80px, 60px) scale(1.2); }
    }
    @keyframes floatGlow2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-70px, -60px) scale(1.15); }
    }

    .container { max-width: 600px; margin: 0 auto; padding-bottom: 50px; position: relative; z-index: 1; }
    
    .header { text-align: center; margin-bottom: 28px; padding-top: 8px; }
    .header h1 { 
      font-size: 23px; 
      font-weight: 800; 
      margin: 0 0 8px; 
      background: linear-gradient(90deg, #38bdf8, #818cf8, #a78bfa, #38bdf8); 
      background-size: 250% auto; 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      animation: gradientMove 6s linear infinite; 
      text-shadow: 0 0 30px rgba(99,102,241,0.25); 
    }
    @keyframes gradientMove {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }
    .header p { font-size: 12px; color: var(--text-muted); margin: 0; }

    .card { 
      position: relative;
      background: linear-gradient(135deg, rgba(36, 46, 75, 0.82), rgba(17, 24, 45, 0.88)); 
      border-radius: 20px; 
      padding: 20px; 
      margin-bottom: 18px; 
      border: 1px solid var(--border-color); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.04); 
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(129,140,248,0.7), rgba(56,189,248,0.6), transparent);
    }
    .card h3 { 
      font-size: 14px; 
      color: #fff; 
      margin: 0 0 16px; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      border-bottom: 1px solid rgba(255,255,255,0.07); 
      padding-bottom: 12px; 
    }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 10px; font-weight: 700; color: #9ca9c3; text-transform: uppercase; margin-bottom: 7px; letter-spacing: 0.6px; }
    .form-control { 
      width: 100%; 
      background: linear-gradient(135deg, rgba(7,12,28,0.65), rgba(17,24,45,0.72)); 
      border: 1px solid rgba(129,140,248,0.20); 
      padding: 12px 14px; 
      border-radius: 11px; 
      color: #fff; 
      font-size: 13px; 
      outline: none; 
      transition: all 0.25s ease; 
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.18);
    }
    .form-control::placeholder { color: #52617b; }
    .form-control:focus { border-color: var(--accent); background: rgba(12,20,40,0.85); box-shadow: 0 0 0 3px rgba(56,189,248,0.08), 0 0 18px rgba(56,189,248,0.12); }

    .btn-next { 
      width: 100%; 
      background: linear-gradient(135deg, #7064ff 0%, #5546e8 45%, #7c3aed 100%); 
      color: #fff; 
      border: 1px solid rgba(255,255,255,0.12); 
      padding: 14px; 
      border-radius: 13px; 
      font-size: 13px; 
      font-weight: 800; 
      cursor: pointer; 
      box-shadow: 0 10px 28px rgba(99,102,241,0.35); 
      margin-top: 10px;
    }
    .btn-next:disabled { opacity: 0.7; cursor: not-allowed; }

    .order-summary { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 10px; color: #aab6cc; }
    .order-summary b { color: #5eead4; font-weight: 700; }
    #termsCheck { accent-color: #6d5dfc; width: 15px; height: 15px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🚀 Enter Your Details</h1>
    <p>Fill in your account registration details to proceed</p>
  </div>

  <!-- Billing & Details Form -->
  <div class="card">
    <h3>👤 1. Billing & Account Details</h3>
    <form id="checkoutForm" onsubmit="goToPayment(event)">
      <div class="form-group">
        <label>Affiliate / Referral Code *</label>
        <input type="text" id="refCode" class="form-control" placeholder="Enter Sponsor Referral ID" required>
      </div>
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="fullName" class="form-control" placeholder="Enter your full name" required>
      </div>
      <div class="form-group">
        <label>Mobile Number *</label>
        <input type="tel" id="mobileNumber" class="form-control" placeholder="10-digit mobile number" required>
      </div>
      <div class="form-group">
        <label>Email ID (For Login) *</label>
        <input type="email" id="emailId" class="form-control" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label>Create Password *</label>
        <input type="password" id="password" class="form-control" placeholder="Set secure password" required>
      </div>
    </form>
  </div>

  <!-- Order Summary & Next Button -->
  <div class="card">
    <h3>📦 Order Summary</h3>
    <div class="order-summary">
      <span>Package Selected:</span>
      <b id="summaryPkgName">Starter Package</b>
    </div>
    <div class="order-summary" style="font-size: 16px; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px;">
      <span>Grand Total:</span>
      <b id="summaryPrice" style="font-size: 18px; color: var(--accent);">₹289</b>
    </div>
    
    <div style="margin: 15px 0; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 8px;">
      <input type="checkbox" id="termsCheck" checked>
      <span>I agree to the Terms & Privacy Policy</span>
    </div>

    <button type="button" class="btn-next" id="proceedBtn" onclick="goToPayment()">Next ➔ Proceed to Payment</button>
  </div>
</div>

<script>
  // Supabase Setup
  const SUPABASE_URL = "https://rvprrulkjegvicbnjuft.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_IdI5j4Q4qcd-1knRMVeGKw_O3Ek42ZJ";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const urlParams = new URLSearchParams(window.location.search);
  const pkgName = urlParams.get('name') || urlParams.get('package') || 'Starter Package';
  const pkgPrice = urlParams.get('price') || '289';
  const refCodeFromUrl = urlParams.get('ref') || '';

  document.getElementById('summaryPkgName').innerText = pkgName;
  document.getElementById('summaryPrice').innerText = `₹${pkgPrice}`;
  if (refCodeFromUrl) {
    document.getElementById('refCode').value = refCodeFromUrl;
  }

  async function goToPayment(e) {
    if(e) e.preventDefault();

    const refId = document.getElementById('refCode').value.trim();
    const fullName = document.getElementById('fullName').value.trim();
    const mobile = document.getElementById('mobileNumber').value.trim();
    const email = document.getElementById('emailId').value.trim();
    const password = document.getElementById('password').value.trim();
    const terms = document.getElementById('termsCheck').checked;
    const btn = document.getElementById('proceedBtn');

    if (!refId) {
      alert("⚠️ Affiliate / Referral Code is required!");
      document.getElementById('refCode').focus();
      return;
    }
    if (!fullName || !mobile || !email || !password) {
      alert("⚠️ Please fill in all required details!");
      return;
    }
    if (!terms) {
      alert("⚠️ Please agree to the Terms & Privacy Policy.");
      return;
    }

    btn.innerText = "Verifying Details...";
    btn.disabled = true;

    try {
      // 1. Strict Referral ID Validation against Database & Master ID
      const masterReferralCode = "SM-smart66779";
      let isValidRef = (refId === masterReferralCode);

      if (!isValidRef) {
        // Database se check karein ki kya yeh referral_id ya email database mein approved ya existing user ke roop mein maujud hai
        const { data: refData, error: refError } = await supabaseClient
          .from('payment_requests')
          .select('id, status')
          .or(`referral_id.eq.${refId},email.eq.${refId}`)
          .eq('status', 'Approved')
          .limit(1);

        if (refError) {
          console.error("Referral check error:", refError);
        }

        if (refData && refData.length > 0) {
          isValidRef = true;
        }
      }

      if (!isValidRef) {
        alert("⚠️ Invalid Referral ID! Kripya ek valid Sponsor Referral ID (jaise SM-smart66779 ya approved member ki ID) enter karein.");
        btn.innerText = "Next ➔ Proceed to Payment";
        btn.disabled = false;
        document.getElementById('refCode').focus();
        return;
      }

      // 2. Check if Email already exists in database
      const { data: emailData, error: emailError } = await supabaseClient
        .from('payment_requests')
        .select('email')
        .eq('email', email)
        .limit(1);

      if (emailError) console.error(emailError);
      if (emailData && emailData.length > 0) {
        alert("⚠️ This Email ID is already registered! Please use a different email or login.");
        btn.innerText = "Next ➔ Proceed to Payment";
        btn.disabled = false;
        document.getElementById('emailId').focus();
        return;
      }

      // 3. Check if Mobile number already exists in database
      const { data: mobileData, error: mobileError } = await supabaseClient
        .from('payment_requests')
        .select('mobile')
        .eq('mobile', mobile)
        .limit(1);

      if (mobileError) console.error(mobileError);
      if (mobileData && mobileData.length > 0) {
        alert("⚠️ This Mobile Number is already registered! One account is allowed per mobile number.");
        btn.innerText = "Next ➔ Proceed to Payment";
        btn.disabled = false;
        document.getElementById('mobileNumber').focus();
        return;
      }

      // All validations passed, redirect to payment page with parameters
      const params = new URLSearchParams({
        name: pkgName,
        price: pkgPrice,
        ref: refId,
        fullname: fullName,
        mobile: mobile,
        email: email,
        password: password
      });

      window.location.href = `payment.html?${params.toString()}`;

    } catch (err) {
      console.error("Validation Error:", err);
      alert("⚠️ Error validating details. Please try again.");
      btn.innerText = "Next ➔ Proceed to Payment";
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
