<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout & Payment - Smart Money</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: #f1f5f9; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .checkout-card { background: #fff; padding: 30px; border-radius: 20px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    h2 { font-size: 24px; font-weight: 700; color: #0f172a; margin-bottom: 20px; text-align: center; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 5px; }
    .input-field { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 14px; outline: none; }
    .btn-submit { width: 100%; background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 10px; }
    .qr-box { text-align: center; background: #f8fafc; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px dashed #cbd5e1; }
    .qr-box img { width: 150px; height: 150px; object-fit: contain; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="checkout-card" id="formContainer">
    <h2>Complete Your Order</h2>
    
    <div class="input-group">
      <label>Referral Code (Compulsory)</label>
      <input type="text" id="refCode" class="input-field" placeholder="Enter Referral ID (e.g. SM-Smart12345)">
    </div>
    <div class="input-group">
      <label>Full Name</label>
      <input type="text" id="fullName" class="input-field" placeholder="Enter full name">
    </div>
    <div class="input-group">
      <label>Email Address</label>
      <input type="email" id="email" class="input-field" placeholder="Enter email address">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" class="input-field" placeholder="Create password">
    </div>

    <div class="qr-box">
      <p style="font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 5px;">Scan QR Code to Pay <span id="packagePriceDisplay" style="color: #6366f1;"></span></p>
      <img src="qr_code.jpg" alt="UPI QR Code"> <!-- Yahan apna UPI QR image ka path ya link dalein -->
      <p style="font-size: 12px; color: #64748b;">UPI ID: <b>yourupi@ybl</b></p>
    </div>

    <div class="input-group">
      <label>UTR / Transaction ID (Compulsory)</label>
      <input type="text" id="utrNumber" class="input-field" placeholder="Enter 12-digit UTR number">
    </div>
    <div class="input-group">
      <label>Upload Payment Screenshot (Compulsory)</label>
      <input type="file" id="paymentProof" class="input-field" accept="image/*">
    </div>

    <button onclick="submitOrder()" class="btn-submit" id="submitBtn">Submit Payment & Register</button>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  emailjs.init("FxcimUvl0-ZxAauRx"); // Aapka EmailJS key
  const SUPABASE_URL = "https://rvprrulkjegvicbnjuft.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_IdI5j4Q4qcd-1knRMVeGKw_O3Ek42ZJ";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  // URL se package aur price nikalna
  const urlParams = new URLSearchParams(window.location.search);
  const packageName = urlParams.get("package") || "Starter Package";
  const packagePrice = urlParams.get("price") || "₹499";
  document.getElementById("packagePriceDisplay").innerText = `(${packagePrice})`;

  // Auto-fill referral from URL if passed
  const refParam = urlParams.get("ref");
  if(refParam) document.getElementById("refCode").value = refParam;

  async function submitOrder() {
    const ref = document.getElementById("refCode").value.trim();
    const name = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const utr = document.getElementById("utrNumber").value.trim();
    const fileInput = document.getElementById("paymentProof");
    const btn = document.getElementById("submitBtn");

    if(!ref || !name || !email || !password || !utr || fileInput.files.length === 0) {
      alert("⚠️ Sabhi fields aur payment proof / UTR number bharna zaroori hai!");
      return;
    }

    btn.innerText = "Submitting...";
    btn.disabled = true;

    try {
      // 1. Check Referral Code validity
      const { data: refCheck, error: refErr } = await supabaseClient
        .from('profiles').select('user_id').eq('referral_code', ref).maybeSingle();

      if(refErr || !refCheck) throw new Error("Invalid Referral ID! Yeh code database mein nahi hai.");

      // 2. Upload Screenshot to Supabase Storage (Bucket name: 'payment-proofs')
      const file = fileInput.files[0];
      const filePath = `proofs/${Date.now()}_${file.name}`;
      const { data: uploadData, error: uploadErr } = await supabaseClient.storage
        .from('payment-proofs')
        .upload(filePath, file);

      if(uploadErr) throw new Error("Screenshot upload failed: " + uploadErr.message);

      // Public URL get karna
      const { data: publicUrlData } = supabaseClient.storage
        .from('payment-proofs')
        .getPublicUrl(filePath);
      
      const proofUrl = publicUrlData.publicUrl;

      // 3. Register user with Supabase Auth
      const { data: authData, error: authErr } = await supabaseClient.auth.signUp({
        email: email, password: password,
        options: { data: { full_name: name, referral_id: ref } }
      });

      if(authErr) throw authErr;

      const userId = authData.user?.id;
      const generatedRefCode = "SM-Smart" + Math.floor(10000 + Math.random() * 90000);

      // 4. Insert into profiles with PENDING status
      const { error: profileErr } = await supabaseClient.from('profiles').insert([{
        user_id: userId,
        full_name: name,
        referral_code: generatedRefCode,
        referred_by: ref,
        package_name: packageName,
        utr_number: utr,
        payment_proof: proofUrl,
        status: 'PENDING', // Jab tak admin approve nahi karega, locked rahega
        balance: 0.00
      }]);

      if(profileErr) throw profileErr;

      // 5. Show Pending Success Screen
      document.getElementById("formContainer").innerHTML = `
        <h2>⏳ Verification Pending</h2>
        <p style="font-size:14px;color:#64748b;margin:15px 0;line-height:1.6;">
          Aapka payment proof aur UTR number successfully submit ho gaya hai! Admin dwara verify karne ke baad aapke email (<b>${email}</b>) par "Congratulations" ka message bhej diya jayega aur account activate ho jayega.
        </p>
        <button onclick="window.location.href='login.html'" class="btn-submit">Go to Login Page</button>
      `;

    } catch(err) {
      alert("Error: " + err.message);
      btn.innerText = "Submit Payment & Register";
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
