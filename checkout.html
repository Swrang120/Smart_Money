<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Checkout - Smart Money</title>
<meta name="description" content="Complete your package purchase securely on Smart Money.">
<meta name="keywords" content="smart money, checkout, affiliate platform, secure payment">
<meta name="author" content="Smart Money">
<link rel="canonical" href="https://smart-money-navy.vercel.app/checkout.html">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
--bg:#070b1a;--card:rgba(23,31,55,.82);--border:rgba(129,140,248,.22);
--primary:#6d5dfc;--accent:#38bdf8;--success:#34d399;--danger:#fb7185;
--warning:#fbbf24;--text:#f8fafc;--muted:#94a3b8
}
*{box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
html,body{min-height:100%;margin:0}
body{color:var(--text);padding:16px;overflow-x:hidden;background:
radial-gradient(circle at 15% 20%,rgba(99,102,241,.18),transparent 28%),
radial-gradient(circle at 85% 10%,rgba(56,189,248,.12),transparent 25%),
radial-gradient(circle at 50% 85%,rgba(139,92,246,.14),transparent 35%),
linear-gradient(135deg,#070b1a,#0d1025 45%,#151238)}
.container{max-width:600px;margin:auto;padding-bottom:50px}
.header{text-align:center;margin-bottom:28px;padding-top:8px}
.header-icon{width:54px;height:54px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;border-radius:17px;background:linear-gradient(135deg,rgba(109,93,252,.22),rgba(56,189,248,.12));border:1px solid var(--border);box-shadow:0 12px 30px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.08);font-size:25px}
.header h1{font-size:23px;font-weight:800;margin:0 0 8px;background:linear-gradient(90deg,#38bdf8,#818cf8,#a78bfa,#38bdf8);background-size:250% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradient 6s linear infinite}
@keyframes gradient{to{background-position:200% center}}
.header p{font-size:12px;color:var(--muted);margin:0}
.card{position:relative;background:linear-gradient(135deg,rgba(36,46,75,.82),rgba(17,24,45,.88));border-radius:20px;padding:20px;margin-bottom:18px;border:1px solid var(--border);backdrop-filter:blur(20px);box-shadow:0 12px 30px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.04);overflow:hidden}
.card h3{font-size:14px;margin:0 0 16px;display:flex;gap:8px;align-items:center;border-bottom:1px solid rgba(255,255,255,.07);padding-bottom:12px}
.form-group{margin-bottom:16px}
label.form-label,.form-group label{display:block;font-size:10px;font-weight:700;color:#9ca9c3;text-transform:uppercase;margin-bottom:7px;letter-spacing:.6px}
.form-control{width:100%;background:linear-gradient(135deg,rgba(7,12,28,.65),rgba(17,24,45,.72));border:1px solid rgba(129,140,248,.2);padding:12px 14px;border-radius:11px;color:#fff;font-size:13px;outline:0;transition:.25s;box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
.form-control::placeholder{color:#52617b}.form-control:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.08),0 0 18px rgba(56,189,248,.12)}
.form-control.valid{border-color:rgba(52,211,153,.65)}.form-control.invalid{border-color:rgba(251,113,133,.7)}
.field-status{min-height:18px;margin-top:6px;font-size:10px;line-height:1.5;display:none}.field-status.show{display:block}.success{color:var(--success)}.error{color:var(--danger)}.checking{color:var(--warning)}
.password-note{margin-top:7px;font-size:9px;color:#71809a}
.order-summary{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:10px;color:#aab6cc;gap:15px}
.order-summary b{color:#5eead4;text-align:right}.total-row{font-size:16px!important;margin-top:12px!important;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}.total-price{font-size:19px!important;color:var(--accent)!important}
.terms-box{margin:16px 0;font-size:11px;color:var(--muted);display:flex;align-items:flex-start;gap:9px;line-height:1.5}
#termsCheck{accent-color:#6d5dfc;width:15px;height:15px;margin-top:1px;flex-shrink:0}
.btn-next{width:100%;background:linear-gradient(135deg,#7064ff,#5546e8 45%,#7c3aed);color:#fff;border:1px solid rgba(255,255,255,.12);padding:14px;border-radius:13px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 10px 28px rgba(99,102,241,.35);margin-top:10px;transition:.2s}
.btn-next:hover:not(:disabled){transform:translateY(-2px)}.btn-next:disabled{opacity:.65;cursor:not-allowed}
.security-box{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:16px;font-size:9px;color:#64748b;text-align:center}
.notice{display:none;padding:11px 13px;border-radius:11px;margin-bottom:15px;font-size:11px;line-height:1.5;border:1px solid rgba(251,191,36,.25);background:rgba(251,191,36,.07);color:#fcd34d}
@media(max-width:480px){body{padding:12px}.header{margin-bottom:22px}.header h1{font-size:21px}.card{padding:17px;border-radius:17px}.form-control{padding:13px;font-size:13px}}
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <div class="header-icon">🧾</div>
    <h1>Enter Your Details</h1>
    <p>Verify your account details before proceeding to payment</p>
  </div>

  <div id="topNotice" class="notice"></div>

  <form id="checkoutForm" novalidate>
    <div class="card">
      <h3>👤 <span>1. Billing &amp; Account Details</span></h3>

      <div class="form-group">
        <label for="refCode">Affiliate / Referral Code *</label>
        <input type="text" id="refCode" class="form-control" placeholder="e.g. SM-smart12345" autocomplete="off" maxlength="50" required>
        <div id="refStatus" class="field-status"></div>
      </div>

      <div class="form-group">
        <label for="fullName">Full Name *</label>
        <input type="text" id="fullName" class="form-control" placeholder="Enter your full name" autocomplete="name" maxlength="80" required>
      </div>

      <div class="form-group">
        <label for="mobileNumber">Mobile Number *</label>
        <input type="tel" id="mobileNumber" class="form-control" placeholder="10-digit mobile number" autocomplete="tel" inputmode="numeric" maxlength="10" required>
        <div id="mobileStatus" class="field-status"></div>
      </div>

      <div class="form-group">
        <label for="emailId">Email ID / Gmail *</label>
        <input type="email" id="emailId" class="form-control" placeholder="your@gmail.com" autocomplete="email" maxlength="120" required>
        <div id="emailStatus" class="field-status"></div>
      </div>

      <div class="form-group">
        <label for="password">Create Password *</label>
        <input type="password" id="password" class="form-control" placeholder="Create your login password" autocomplete="new-password" minlength="6" maxlength="72" required>
        <div class="password-note">🔒 Your password should be at least 6 characters.</div>
      </div>
    </div>

    <div class="card">
      <h3>📦 <span>Order Summary</span></h3>
      <div class="order-summary"><span>Package Selected:</span><b id="summaryPkgName">Starter Package</b></div>
      <div class="order-summary total-row"><span>Grand Total:</span><b id="summaryPrice" class="total-price">₹289</b></div>

      <label class="terms-box">
        <input type="checkbox" id="termsCheck" checked>
        <span>I agree to the Terms &amp; Privacy Policy and confirm that the information provided by me is correct.</span>
      </label>

      <button type="submit" class="btn-next" id="proceedBtn">Next ➔ Proceed to Payment</button>

      <div class="security-box">🔐 <span>Your account details are checked before continuing.</span></div>
    </div>
  </form>
</div>

<script>
/* =========================================================
   SMART MONEY CHECKOUT — FIXED VERSION
   Referral lookup uses a Supabase RPC fallback because
   direct profiles SELECT may be blocked by RLS.
========================================================= */

const SUPABASE_URL="https://rvprrulkjegvicbnjuft.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_IdI5j4Q4qcd-1knRMVeGKw_O3Ek42ZJ";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const params=new URLSearchParams(location.search);
const pkgName=params.get("name")||params.get("package")||"Starter Package";
const pkgPrice=params.get("price")||"289";
const refFromUrl=(params.get("ref")||"").trim();

const $=id=>document.getElementById(id);
const refCodeInput=$("refCode"),fullNameInput=$("fullName"),mobileInput=$("mobileNumber"),
emailInput=$("emailId"),passwordInput=$("password"),termsCheck=$("termsCheck"),
proceedBtn=$("proceedBtn"),refStatus=$("refStatus"),mobileStatus=$("mobileStatus"),
emailStatus=$("emailStatus"),topNotice=$("topNotice");

$("summaryPkgName").textContent=pkgName;
$("summaryPrice").textContent=formatPrice(pkgPrice);
if(refFromUrl)refCodeInput.value=refFromUrl;

function formatPrice(v){
  const n=Number(String(v).replace(/[₹,\s]/g,""));
  return Number.isFinite(n)?"₹"+n.toLocaleString("en-IN"):"₹0";
}
function status(el,msg,type){
  el.textContent=msg;
  el.className="field-status show "+type;
}
function clearStatus(el){el.textContent="";el.className="field-status";}
function inputState(el,state){
  el.classList.remove("valid","invalid");
  if(state)el.classList.add(state);
}
function validReferral(v){return /^SM-smart[a-zA-Z0-9]+$/i.test(v.trim());}
function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());}
function validMobile(v){return /^[0-9]{10}$/.test(v.trim());}
function showNotice(msg){
  topNotice.textContent=msg;
  topNotice.style.display="block";
}
function hideNotice(){topNotice.style.display="none";topNotice.textContent="";}

/* ---------------------------------------------------------
   REFERRAL LOOKUP
   1) Try direct query.
   2) If RLS blocks it, use SECURITY DEFINER RPC.
--------------------------------------------------------- */
async function getReferrerProfile(refId){
  const clean=refId.trim();

  const direct=await supabaseClient
    .from("profiles")
    .select("user_id,referral_code,referral_id")
    .eq("referral_code",clean)
    .limit(1);

  if(!direct.error && direct.data?.length){
    return {data:direct.data[0],error:null};
  }

  const directId=await supabaseClient
    .from("profiles")
    .select("user_id,referral_code,referral_id")
    .eq("referral_id",clean)
    .limit(1);

  if(!directId.error && directId.data?.length){
    return {data:directId.data[0],error:null};
  }

  /* RPC handles RLS safely on the server side. */
  const rpc=await supabaseClient.rpc("get_referrer_profile",{p_ref_code:clean});

  if(rpc.error){
    console.error("Referral direct lookup:",direct.error||directId.error);
    console.error("Referral RPC error:",rpc.error);
    return {data:null,error:rpc.error};
  }

  if(rpc.data?.length){
    return {data:rpc.data[0],error:null};
  }

  return {data:null,error:null};
}

async function validateReferral(){
  const ref=refCodeInput.value.trim();
  clearStatus(refStatus);inputState(refCodeInput,null);

  if(!validReferral(ref)){
    status(refStatus,"❌ Invalid format. Example: SM-smart12345","error");
    inputState(refCodeInput,"invalid");
    return {valid:false,referrer:null};
  }

  status(refStatus,"⏳ Checking Referral ID...","checking");
  const result=await getReferrerProfile(ref);

  if(result.error){
    status(refStatus,"⚠️ Referral verification is blocked by database security. Run the SQL fix below.","error");
    inputState(refCodeInput,"invalid");
    return {valid:false,referrer:null,error:result.error};
  }

  if(!result.data){
    status(refStatus,"❌ Invalid Referral ID. This ID does not exist.","error");
    inputState(refCodeInput,"invalid");
    return {valid:false,referrer:null};
  }

  status(refStatus,"✓ Valid Referral ID","success");
  inputState(refCodeInput,"valid");
  return {valid:true,referrer:result.data};
}

/* ---------------------------------------------------------
   DUPLICATE CHECKS
   RLS can block these checks. A blocked SELECT is NOT treated
   as "user does not exist"; final Auth signup remains the source
   of truth for email uniqueness.
--------------------------------------------------------- */
async function checkEmailExists(email){
  const clean=email.trim().toLowerCase();
  const p=await supabaseClient.from("profiles").select("user_id").ilike("email",clean).limit(1);
  if(!p.error&&p.data?.length)return {exists:true,error:null};
  const pay=await supabaseClient.from("payment_requests").select("id").ilike("email",clean).limit(1);
  if(!pay.error&&pay.data?.length)return {exists:true,error:null};
  return {exists:false,error:p.error||pay.error||null};
}
async function checkMobileExists(mobile){
  const clean=mobile.trim();
  const p=await supabaseClient.from("profiles").select("user_id").eq("mobile",clean).limit(1);
  if(!p.error&&p.data?.length)return {exists:true,error:null};
  const pay=await supabaseClient.from("payment_requests").select("id").eq("mobile",clean).limit(1);
  if(!pay.error&&pay.data?.length)return {exists:true,error:null};
  return {exists:false,error:p.error||pay.error||null};
}

async function validateEmailExists(){
  const email=emailInput.value.trim().toLowerCase();
  clearStatus(emailStatus);inputState(emailInput,null);
  if(!validEmail(email))return false;
  status(emailStatus,"⏳ Checking email...","checking");
  const r=await checkEmailExists(email);
  if(r.exists){
    status(emailStatus,"❌ This Email/Gmail already exists.","error");
    inputState(emailInput,"invalid");return false;
  }
  status(emailStatus,"✓ Email is available","success");
  inputState(emailInput,"valid");return true;
}
async function validateMobileExists(){
  const mobile=mobileInput.value.trim();
  clearStatus(mobileStatus);inputState(mobileInput,null);
  if(!validMobile(mobile))return false;
  status(mobileStatus,"⏳ Checking mobile number...","checking");
  const r=await checkMobileExists(mobile);
  if(r.exists){
    status(mobileStatus,"❌ This mobile number already exists.","error");
    inputState(mobileInput,"invalid");return false;
  }
  status(mobileStatus,"✓ Mobile number is available","success");
  inputState(mobileInput,"valid");return true;
}

/* ---------------------------------------------------------
   UNIQUE BUYER REFERRAL CODE
--------------------------------------------------------- */
async function generateUniqueReferralCode(){
  for(let i=0;i<20;i++){
    const code="SM-smart"+Math.random().toString(36).substring(2,10);
    const r=await supabaseClient.from("profiles").select("user_id").eq("referral_code",code).limit(1);
    if(r.error){
      /* Collision is extremely unlikely. Let the DB insert decide if
         SELECT is blocked by RLS; return the generated code. */
      return code;
    }
    if(!r.data?.length)return code;
  }
  throw new Error("Unable to generate a unique referral code.");
}

/* ---------------------------------------------------------
   CREATE AUTH USER + PROFILE
--------------------------------------------------------- */
async function createSmartMoneyAccount(fullName,mobile,email,password,referrer){
  if(!referrer?.user_id)throw new Error("INVALID_REFERRER");

  const current=await supabaseClient.auth.getSession();
  if(current.error)throw new Error(current.error.message);

  let session=current.data.session;
  let user=session?.user||null;

  if(!user){
    const signUp=await supabaseClient.auth.signUp({
      email,
      password,
      options:{
        data:{
          full_name:fullName,
          mobile,
          referred_by:referrer.referral_code||referrer.referral_id||""
        }
      }
    });

    if(signUp.error){
      console.error("Supabase signup error:",signUp.error);
      throw new Error(signUp.error.message);
    }

    user=signUp.data.user;
    session=signUp.data.session;
  }

  if(!user)throw new Error("Unable to create your Smart Money account.");

  if(!session)throw new Error("ACCOUNT_CONFIRMATION_REQUIRED");

  const buyerCode=await generateUniqueReferralCode();
  const actualReferral=referrer.referral_code||referrer.referral_id;
  if(!actualReferral)throw new Error("INVALID_REFERRER");

  const profile={
    user_id:user.id,
    full_name:fullName,
    email,
    mobile,
    referral_code:buyerCode,
    referred_by:actualReferral,
    referral_id:actualReferral,
    status:"PENDING",
    balance:0,
    is_active:false
  };

  const existing=await supabaseClient.from("profiles").select("user_id").eq("user_id",user.id).limit(1);

  if(existing.error){
    /* If RLS blocks SELECT, try upsert directly. */
    console.warn("Profile existence lookup blocked:",existing.error);
  }

  let profileResult;
  if(existing.data?.length){
    profileResult=await supabaseClient.from("profiles").update(profile).eq("user_id",user.id);
  }else{
    profileResult=await supabaseClient.from("profiles").insert(profile);
    if(profileResult.error && /duplicate|unique/i.test(profileResult.error.message)){
      profileResult=await supabaseClient.from("profiles").update(profile).eq("user_id",user.id);
    }
  }

  if(profileResult.error){
    console.error("Profile save error:",profileResult.error);
    throw new Error("Profile could not be saved: "+profileResult.error.message);
  }

  return {userId:user.id,referralCode:buyerCode,referredBy:actualReferral};
}

/* ---------------------------------------------------------
   INPUT EVENTS
--------------------------------------------------------- */
refCodeInput.addEventListener("input",function(){
  this.value=this.value.replace(/\s/g,"");
  clearStatus(refStatus);inputState(this,null);
});
mobileInput.addEventListener("input",function(){
  this.value=this.value.replace(/\D/g,"").slice(0,10);
  clearStatus(mobileStatus);inputState(this,null);
});
emailInput.addEventListener("input",function(){
  this.value=this.value.trim().toLowerCase();
  clearStatus(emailStatus);inputState(this,null);
});
refCodeInput.addEventListener("blur",async()=>{if(refCodeInput.value.trim())await validateReferral();});
emailInput.addEventListener("blur",async()=>{
  if(!emailInput.value.trim())return;
  if(!validEmail(emailInput.value)){status(emailStatus,"❌ Please enter a valid email address.","error");inputState(emailInput,"invalid");return;}
  await validateEmailExists();
});
mobileInput.addEventListener("blur",async()=>{
  if(!mobileInput.value.trim())return;
  if(!validMobile(mobileInput.value)){status(mobileStatus,"❌ Enter a valid 10-digit mobile number.","error");inputState(mobileInput,"invalid");return;}
  await validateMobileExists();
});

/* ---------------------------------------------------------
   MAIN CHECKOUT
--------------------------------------------------------- */
async function goToPayment(event){
  event?.preventDefault();
  hideNotice();

  const ref=refCodeInput.value.trim();
  const fullName=fullNameInput.value.trim();
  const mobile=mobileInput.value.trim();
  const email=emailInput.value.trim().toLowerCase();
  const password=passwordInput.value;

  if(!ref||!fullName||!mobile||!email||!password){
    alert("⚠️ Please fill in all required details.");return;
  }
  if(!validReferral(ref)){alert("⚠️ Invalid Referral ID!\n\nExample: SM-smart12345");refCodeInput.focus();return;}
  if(!validMobile(mobile)){alert("⚠️ Please enter a valid 10-digit mobile number.");mobileInput.focus();return;}
  if(!validEmail(email)){alert("⚠️ Please enter a valid email address.");emailInput.focus();return;}
  if(password.length<6){alert("⚠️ Password must contain at least 6 characters.");passwordInput.focus();return;}
  if(!termsCheck.checked){alert("⚠️ Please agree to the Terms & Privacy Policy.");return;}

  proceedBtn.disabled=true;

  try{
    proceedBtn.textContent="⏳ Verifying Referral ID...";
    const referral=await validateReferral();

    if(referral.error){
      alert("⚠️ Referral account could not be verified.\n\nDatabase verification is blocked. Please run the Supabase SQL fix provided with this update.");
      resetButton();return;
    }
    if(!referral.valid||!referral.referrer){
      alert("❌ Invalid Referral ID!\n\nThis referral account does not exist.");
      resetButton();refCodeInput.focus();return;
    }

    proceedBtn.textContent="⏳ Checking Email...";
    const emailCheck=await checkEmailExists(email);
    if(emailCheck.exists){
      status(emailStatus,"❌ This Email/Gmail already exists.","error");
      inputState(emailInput,"invalid");
      alert("❌ Email Already Exists!\n\nPlease use another email.");
      resetButton();emailInput.focus();return;
    }

    proceedBtn.textContent="⏳ Checking Mobile Number...";
    const mobileCheck=await checkMobileExists(mobile);
    if(mobileCheck.exists){
      status(mobileStatus,"❌ This mobile number already exists.","error");
      inputState(mobileInput,"invalid");
      alert("❌ Mobile Number Already Exists!\n\nPlease use another mobile number.");
      resetButton();mobileInput.focus();return;
    }

    proceedBtn.textContent="⏳ Creating Smart Money Account...";
    const account=await createSmartMoneyAccount(fullName,mobile,email,password,referral.referrer);

    const checkoutData={
      name:pkgName,price:pkgPrice,ref,
      fullname:fullName,mobile,email,
      user_id:account.userId,
      referral_code:account.referralCode,
      referred_by:account.referredBy
    };

    sessionStorage.setItem("checkout_data",JSON.stringify(checkoutData));
    proceedBtn.textContent="✓ Account Created";

    setTimeout(()=>{
      location.href="payment.html?name="+encodeURIComponent(pkgName)+"&price="+encodeURIComponent(pkgPrice);
    },400);

  }catch(error){
    console.error("SMART MONEY CHECKOUT ERROR:",error);

    if(error.message==="ACCOUNT_CONFIRMATION_REQUIRED"){
      alert("📧 Email Confirmation Required\n\nYour account was created, but Supabase requires email confirmation.\n\nPlease confirm your email and then continue.");
      resetButton();return;
    }

    if(error.message==="INVALID_REFERRER"){
      status(refStatus,"❌ Referral account could not be verified.","error");
      inputState(refCodeInput,"invalid");
      alert("❌ Referral account could not be verified.\n\nPlease check the Referral ID.");
      resetButton();return;
    }

    alert("⚠️ Unable to create your Smart Money account.\n\n"+(error.message||"Please try again."));
    resetButton();
  }
}

function resetButton(){
  proceedBtn.textContent="Next ➔ Proceed to Payment";
  proceedBtn.disabled=false;
}

$("checkoutForm").addEventListener("submit",goToPayment);
$("checkoutForm").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.tagName!=="TEXTAREA")e.preventDefault();
});
</script>
</body>
</html>
