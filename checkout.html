<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://rvprrulkjegvicbnjuft.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_IdI5j4Q4qcd-1knRMVeGKw_O3Ek42ZJ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   URL DATA
========================================================= */

const urlParams =
  new URLSearchParams(
    window.location.search
  );


const pkgName =
  urlParams.get("name") ||
  urlParams.get("package") ||
  "Starter Package";


const pkgPrice =
  urlParams.get("price") ||
  "289";


const refCodeFromUrl =
  urlParams.get("ref") ||
  "";


/* =========================================================
   ELEMENTS
========================================================= */

const refCodeInput =
  document.getElementById("refCode");

const fullNameInput =
  document.getElementById("fullName");

const mobileInput =
  document.getElementById("mobileNumber");

const emailInput =
  document.getElementById("emailId");

const passwordInput =
  document.getElementById("password");

const termsCheck =
  document.getElementById("termsCheck");

const proceedBtn =
  document.getElementById("proceedBtn");

const refStatus =
  document.getElementById("refStatus");

const mobileStatus =
  document.getElementById("mobileStatus");

const emailStatus =
  document.getElementById("emailStatus");


/* =========================================================
   PACKAGE DISPLAY
========================================================= */

document.getElementById(
  "summaryPkgName"
).innerText =
  pkgName;


document.getElementById(
  "summaryPrice"
).innerText =
  formatPrice(pkgPrice);


/* =========================================================
   REFERRAL FROM URL
========================================================= */

if (refCodeFromUrl) {

  refCodeInput.value =
    refCodeFromUrl.trim();

}


/* =========================================================
   PRICE
========================================================= */

function formatPrice(price) {

  const numericPrice =
    Number(
      String(price)
        .replace(/[₹,\s]/g, "")
    );

  if (!Number.isFinite(numericPrice)) {
    return "₹0";
  }

  return (
    "₹" +
    numericPrice.toLocaleString("en-IN")
  );

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  element,
  message,
  type
) {

  element.textContent =
    message;

  element.className =
    "field-status show " +
    type;
}


function clearStatus(element) {

  element.textContent =
    "";

  element.className =
    "field-status";
}


function setInputState(
  input,
  state
) {

  input.classList.remove(
    "valid",
    "invalid"
  );

  if (state) {
    input.classList.add(state);
  }

}


/* =========================================================
   VALIDATION
========================================================= */

function isValidReferralFormat(
  refId
) {

  return /^SM-smart[a-zA-Z0-9]+$/i
    .test(refId.trim());

}


function isValidEmail(email) {

  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
    .test(email.trim());

}


function isValidMobile(mobile) {

  return /^[0-9]{10}$/
    .test(mobile.trim());

}


/* =========================================================
   IMPORTANT:
   FIND REFERRER
   NO .OR() QUERY
========================================================= */

async function getReferrerProfile(
  refId
) {

  const cleanRef =
    refId.trim();


  /* -----------------------------------------
     FIRST:
     referral_code
  ----------------------------------------- */

  const codeResult =
    await supabaseClient
      .from("profiles")
      .select(
        "user_id, referral_code, referral_id"
      )
      .eq(
        "referral_code",
        cleanRef
      )
      .limit(1);


  if (codeResult.error) {

    console.error(
      "Referral code lookup error:",
      codeResult.error
    );

    return {
      data: null,
      error: codeResult.error
    };

  }


  if (
    codeResult.data &&
    codeResult.data.length > 0
  ) {

    return {
      data: codeResult.data[0],
      error: null
    };

  }


  /* -----------------------------------------
     SECOND:
     referral_id FALLBACK
  ----------------------------------------- */

  const idResult =
    await supabaseClient
      .from("profiles")
      .select(
        "user_id, referral_code, referral_id"
      )
      .eq(
        "referral_id",
        cleanRef
      )
      .limit(1);


  if (idResult.error) {

    console.error(
      "Referral ID lookup error:",
      idResult.error
    );

    return {
      data: null,
      error: idResult.error
    };

  }


  if (
    idResult.data &&
    idResult.data.length > 0
  ) {

    return {
      data: idResult.data[0],
      error: null
    };

  }


  return {
    data: null,
    error: null
  };

}


/* =========================================================
   REFERRAL VALIDATION
========================================================= */

async function validateReferral() {

  const refId =
    refCodeInput.value.trim();


  clearStatus(refStatus);

  setInputState(
    refCodeInput,
    null
  );


  if (
    !isValidReferralFormat(refId)
  ) {

    setStatus(
      refStatus,
      "❌ Invalid format. Example: SM-smart12345",
      "error"
    );

    setInputState(
      refCodeInput,
      "invalid"
    );

    return {
      valid: false,
      referrer: null
    };

  }


  setStatus(
    refStatus,
    "⏳ Checking Referral ID...",
    "checking"
  );


  const result =
    await getReferrerProfile(
      refId
    );


  if (result.error) {

    setStatus(
      refStatus,
      "⚠️ Referral account could not be verified.",
      "error"
    );

    setInputState(
      refCodeInput,
      "invalid"
    );

    return {
      valid: false,
      referrer: null,
      error: result.error
    };

  }


  if (!result.data) {

    setStatus(
      refStatus,
      "❌ Invalid Referral ID. This ID does not exist.",
      "error"
    );

    setInputState(
      refCodeInput,
      "invalid"
    );

    return {
      valid: false,
      referrer: null
    };

  }


  setStatus(
    refStatus,
    "✓ Valid Referral ID",
    "success"
  );

  setInputState(
    refCodeInput,
    "valid"
  );


  return {
    valid: true,
    referrer: result.data
  };

}


/* =========================================================
   EMAIL CHECK
========================================================= */

async function checkEmailExists(
  email
) {

  const cleanEmail =
    email.trim().toLowerCase();


  const profileResult =
    await supabaseClient
      .from("profiles")
      .select(
        "user_id, email"
      )
      .ilike(
        "email",
        cleanEmail
      )
      .limit(1);


  if (
    !profileResult.error &&
    profileResult.data &&
    profileResult.data.length > 0
  ) {

    return {
      exists: true,
      error: null
    };

  }


  /* -----------------------------------------
     PAYMENT REQUEST FALLBACK
  ----------------------------------------- */

  const paymentResult =
    await supabaseClient
      .from("payment_requests")
      .select(
        "id, email"
      )
      .ilike(
        "email",
        cleanEmail
      )
      .limit(1);


  if (
    !paymentResult.error &&
    paymentResult.data &&
    paymentResult.data.length > 0
  ) {

    return {
      exists: true,
      error: null
    };

  }


  return {
    exists: false,
    error: null
  };

}


/* =========================================================
   MOBILE CHECK
========================================================= */

async function checkMobileExists(
  mobile
) {

  const cleanMobile =
    mobile.trim();


  const profileResult =
    await supabaseClient
      .from("profiles")
      .select(
        "user_id, mobile"
      )
      .eq(
        "mobile",
        cleanMobile
      )
      .limit(1);


  if (
    !profileResult.error &&
    profileResult.data &&
    profileResult.data.length > 0
  ) {

    return {
      exists: true,
      error: null
    };

  }


  const paymentResult =
    await supabaseClient
      .from("payment_requests")
      .select(
        "id, mobile"
      )
      .eq(
        "mobile",
        cleanMobile
      )
      .limit(1);


  if (
    !paymentResult.error &&
    paymentResult.data &&
    paymentResult.data.length > 0
  ) {

    return {
      exists: true,
      error: null
    };

  }


  return {
    exists: false,
    error: null
  };

}

/* =========================================================
   GENERATE BUYER REFERRAL CODE
========================================================= */

async function generateUniqueReferralCode() {

  for (
    let i = 0;
    i < 15;
    i++
  ) {

    const randomPart =
      Math.random()
        .toString(36)
        .substring(2, 10);


    const newCode =
      "SM-smart" +
      randomPart;


    const result =
      await supabaseClient
        .from("profiles")
        .select("user_id")
        .eq(
          "referral_code",
          newCode
        )
        .limit(1);


    if (result.error) {

      console.error(
        "Referral code generation lookup error:",
        result.error
      );

      throw new Error(
        "Unable to generate your referral code. Please try again."
      );

    }


    if (
      !result.data ||
      result.data.length === 0
    ) {

      return newCode;

    }

  }


  throw new Error(
    "Unable to generate a unique referral code."
  );

}


/* =========================================================
   CREATE ACCOUNT
========================================================= */

async function createSmartMoneyAccount(
  fullName,
  mobile,
  email,
  password,
  referrer
) {


  /* -----------------------------------------
     VERIFY REFERRER OBJECT
  ----------------------------------------- */

  if (
    !referrer ||
    !referrer.user_id
  ) {

    throw new Error(
      "INVALID_REFERRER"
    );

  }


  /* -----------------------------------------
     CURRENT SESSION
  ----------------------------------------- */

  const sessionResult =
    await supabaseClient.auth.getSession();


  if (sessionResult.error) {

    throw new Error(
      sessionResult.error.message
    );

  }


  let session =
    sessionResult.data.session;


  let user =
    session?.user || null;


  /* -----------------------------------------
     CREATE AUTH USER
  ----------------------------------------- */

  if (!user) {

    const signupResult =
      await supabaseClient.auth.signUp({

        email:
          email,

        password:
          password,

        options: {

          data: {

            full_name:
              fullName,

            mobile:
              mobile,

            referred_by:
              referrer.referral_code ||
              referrer.referral_id ||
              ""

          }

        }

      });


    if (signupResult.error) {

      console.error(
        "Supabase signup error:",
        signupResult.error
      );

      throw new Error(
        signupResult.error.message
      );

    }


    user =
      signupResult.data.user;


    session =
      signupResult.data.session;

  }


  /* -----------------------------------------
     USER CHECK
  ----------------------------------------- */

  if (!user) {

    throw new Error(
      "Unable to create your Smart Money account."
    );

  }


  /* -----------------------------------------
     SESSION CHECK
  ----------------------------------------- */

  if (!session) {

    throw new Error(
      "ACCOUNT_CONFIRMATION_REQUIRED"
    );

  }


  /* -----------------------------------------
     BUYER REFERRAL CODE
  ----------------------------------------- */

  const buyerReferralCode =
    await generateUniqueReferralCode();


  /* -----------------------------------------
     CHECK EXISTING PROFILE
  ----------------------------------------- */

  const existingProfile =
    await supabaseClient
      .from("profiles")
      .select(
        "user_id"
      )
      .eq(
        "user_id",
        user.id
      )
      .limit(1);


  if (existingProfile.error) {

    console.error(
      "Existing profile lookup error:",
      existingProfile.error
    );

    throw new Error(
      existingProfile.error.message
    );

  }


  /* -----------------------------------------
     VERIFIED REFERRAL CODE
  ----------------------------------------- */

  const actualReferralCode =
    referrer.referral_code ||
    referrer.referral_id;


  if (!actualReferralCode) {

    throw new Error(
      "INVALID_REFERRER"
    );

  }


  /* -----------------------------------------
     PROFILE DATA
  ----------------------------------------- */

  const profileData = {

    user_id:
      user.id,

    full_name:
      fullName,

    email:
      email,

    mobile:
      mobile,

    referral_code:
      buyerReferralCode,

    referred_by:
      actualReferralCode,

    referral_id:
      actualReferralCode,

    status:
      "PENDING",

    balance:
      0,

    is_active:
      false

  };


  /* -----------------------------------------
     UPDATE EXISTING PROFILE
  ----------------------------------------- */

  if (
    existingProfile.data &&
    existingProfile.data.length > 0
  ) {

    const updateResult =
      await supabaseClient
        .from("profiles")
        .update(profileData)
        .eq(
          "user_id",
          user.id
        );


    if (updateResult.error) {

      console.error(
        "Profile update error:",
        updateResult.error
      );

      throw new Error(
        updateResult.error.message
      );

    }

  }


  /* -----------------------------------------
     INSERT NEW PROFILE
  ----------------------------------------- */

  else {

    const insertResult =
      await supabaseClient
        .from("profiles")
        .insert(
          profileData
        );


    if (insertResult.error) {

      console.error(
        "Profile insert error:",
        insertResult.error
      );

      throw new Error(
        insertResult.error.message
      );

    }

  }


  return {

    userId:
      user.id,

    referralCode:
      buyerReferralCode,

    referredBy:
      actualReferralCode

  };

}


/* =========================================================
   MAIN CHECKOUT
========================================================= */

async function goToPayment(event) {

  if (event) {
    event.preventDefault();
  }


  const refId =
    refCodeInput.value.trim();


  const fullName =
    fullNameInput.value.trim();


  const mobile =
    mobileInput.value.trim();


  const email =
    emailInput.value
      .trim()
      .toLowerCase();


  const password =
    passwordInput.value;


  const terms =
    termsCheck.checked;


  /* -----------------------------------------
     BASIC
  ----------------------------------------- */

  if (
    !refId ||
    !fullName ||
    !mobile ||
    !email ||
    !password
  ) {

    alert(
      "⚠️ Please fill in all required details."
    );

    return;

  }


  if (
    !isValidReferralFormat(refId)
  ) {

    alert(
      "⚠️ Invalid Referral ID!\n\n" +
      "Example:\n" +
      "SM-smart12345"
    );

    refCodeInput.focus();

    return;

  }


  if (
    !isValidMobile(mobile)
  ) {

    alert(
      "⚠️ Please enter a valid 10-digit mobile number."
    );

    mobileInput.focus();

    return;

  }


  if (
    !isValidEmail(email)
  ) {

    alert(
      "⚠️ Please enter a valid email address."
    );

    emailInput.focus();

    return;

  }


  if (
    password.length < 6
  ) {

    alert(
      "⚠️ Password must contain at least 6 characters."
    );

    passwordInput.focus();

    return;

  }


  if (!terms) {

    alert(
      "⚠️ Please agree to the Terms & Privacy Policy."
    );

    return;

  }


  proceedBtn.disabled =
    true;


  try {


    /* =========================================
       STEP 1
       REFERRAL
    ========================================= */

    proceedBtn.innerText =
      "⏳ Verifying Referral ID...";


    const referralResult =
      await validateReferral();


    if (
      referralResult.error
    ) {

      alert(
        "⚠️ Unable to verify referral account.\n\n" +
        "Please try again."
      );

      resetButton();

      return;

    }


    if (
      !referralResult.valid ||
      !referralResult.referrer
    ) {

      alert(
        "❌ Invalid Referral ID!\n\n" +
        "This referral account does not exist."
      );

      resetButton();

      refCodeInput.focus();

      return;

    }


    const referrer =
      referralResult.referrer;


    /* =========================================
       STEP 2
       EMAIL
    ========================================= */

    proceedBtn.innerText =
      "⏳ Checking Email...";


    const emailResult =
      await checkEmailExists(
        email
      );


    if (emailResult.exists) {

      setStatus(
        emailStatus,
        "❌ This Email/Gmail already exists.",
        "error"
      );

      setInputState(
        emailInput,
        "invalid"
      );


      alert(
        "❌ Email Already Exists!\n\n" +
        "Please use another email."
      );


      resetButton();

      emailInput.focus();

      return;

    }


    setStatus(
      emailStatus,
      "✓ Email is available",
      "success"
    );

    setInputState(
      emailInput,
      "valid"
    );


    /* =========================================
       STEP 3
       MOBILE
    ========================================= */

    proceedBtn.innerText =
      "⏳ Checking Mobile Number...";


    const mobileResult =
      await checkMobileExists(
        mobile
      );


    if (mobileResult.exists) {

      setStatus(
        mobileStatus,
        "❌ This mobile number already exists.",
        "error"
      );

      setInputState(
        mobileInput,
        "invalid"
      );


      alert(
        "❌ Mobile Number Already Exists!\n\n" +
        "Please use another mobile number."
      );


      resetButton();

      mobileInput.focus();

      return;

    }


    setStatus(
      mobileStatus,
      "✓ Mobile number is available",
      "success"
    );

    setInputState(
      mobileInput,
      "valid"
    );


    /* =========================================
       STEP 4
       CREATE ACCOUNT
    ========================================= */

    proceedBtn.innerText =
      "⏳ Creating Smart Money Account...";


    const account =
      await createSmartMoneyAccount(
        fullName,
        mobile,
        email,
        password,
        referrer
      );


    /* =========================================
       STEP 5
       CHECKOUT DATA
    ========================================= */

    const checkoutData = {

      name:
        pkgName,

      price:
        pkgPrice,

      ref:
        refId,

      fullname:
        fullName,

      mobile:
        mobile,

      email:
        email,

      user_id:
        account.userId,

      referral_code:
        account.referralCode,

      referred_by:
        account.referredBy

    };


    sessionStorage.setItem(
      "checkout_data",
      JSON.stringify(
        checkoutData
      )
    );


    proceedBtn.innerText =
      "✓ Account Created";


    /* =========================================
       STEP 6
       PAYMENT
    ========================================= */

    setTimeout(
      function () {

        window.location.href =
          "payment.html?name=" +
          encodeURIComponent(
            pkgName
          ) +
          "&price=" +
          encodeURIComponent(
            pkgPrice
          );

      },
      400
    );


  } catch (error) {

    console.error(
      "SMART MONEY CHECKOUT ERROR:",
      error
    );


    /* =========================================
       EMAIL CONFIRMATION
    ========================================= */

    if (
      error.message ===
      "ACCOUNT_CONFIRMATION_REQUIRED"
    ) {

      alert(
        "📧 Email Confirmation Required\n\n" +
        "Your account was created successfully, " +
        "but Supabase requires email confirmation.\n\n" +
        "Please confirm your email and then continue."
      );

      resetButton();

      return;

    }


    /* =========================================
       INVALID REFERRER
    ========================================= */

    if (
      error.message ===
      "INVALID_REFERRER"
    ) {

      setStatus(
        refStatus,
        "❌ Referral account could not be verified.",
        "error"
      );

      setInputState(
        refCodeInput,
        "invalid"
      );


      alert(
        "❌ Referral account could not be verified.\n\n" +
        "Please check the Referral ID."
      );


      resetButton();

      return;

    }


    /* =========================================
       NORMAL ERROR
    ========================================= */

    let message =
      error.message ||
      "Please try again.";


    console.error(
      "Final error:",
      message
    );


    alert(
      "⚠️ Unable to create your Smart Money account.\n\n" +
      message
    );


    resetButton();

  }

}


/* =========================================================
   RESET BUTTON
========================================================= */

function resetButton() {

  proceedBtn.innerText =
    "Next ➔ Proceed to Payment";

  proceedBtn.disabled =
    false;

}


/* =========================================================
   FORM SUBMIT
========================================================= */

document
  .getElementById(
    "checkoutForm"
  )
  .addEventListener(
    "submit",
    goToPayment
  );


/* =========================================================
   PREVENT ENTER SUBMIT
========================================================= */

document
  .getElementById(
    "checkoutForm"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        event.target.tagName !== "TEXTAREA"
      ) {

        event.preventDefault();

      }

    }
  );
