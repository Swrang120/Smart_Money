<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Money - Forgot Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;}
body{
  margin:0;
  background: radial-gradient(circle at 15% 10%, rgba(124,58,237,.30), transparent 40%),
              radial-gradient(circle at 85% 80%, rgba(59,130,246,.18), transparent 40%),
              linear-gradient(135deg, #080a12, #111426, #080a12);
  color:#ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:20px;
}
.box{
  width:100%;
  max-width:420px;
  background:#11131c;
  padding:35px 30px;
  border-radius:24px;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 20px 50px rgba(0,0,0,.60);
}
.brand-title{text-align:center;font-size:22px;font-weight:800;color:#ffffff;margin-bottom:8px;text-shadow:0 0 15px rgba(168,85,247,.50);}
h2{margin:10px 0 10px;color:#ffffff;font-weight:800;text-align:center;font-size:20px;}
p{font-size:13px;color:#9ca3af;margin-bottom:25px;text-align:center;line-height:1.6;}
.form-group{text-align:left;margin-bottom:20px;}
.form-group label{font-size:12px;font-weight:700;color:#c4b5fd;display:block;margin-bottom:8px;letter-spacing:.5px;}
.input-field{
  width:100%;
  padding:13px 16px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);
  color:#ffffff;
  outline:none;
  font-size:14px;
  transition:.3s;
}
.input-field::placeholder{color:#6b7280;}
.input-field:focus{border-color:#8b5cf6;box-shadow:0 0 10px rgba(139,92,246,.30);}
.btn-action{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  color:#ffffff;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(135deg, #7c3aed, #6d28d9);
  font-size:14px;
  box-shadow:0 8px 20px rgba(124,58,237,.40);
  transition:.2s;
}
.btn-action:hover{opacity:.90;}
.btn-action:disabled{opacity:.60;cursor:not-allowed;}
.back-link{display:block;text-align:center;margin-top:20px;font-size:13px;color:#a78bfa;text-decoration:none;font-weight:700;}
.back-link:hover{text-decoration:underline;}
.status{display:none;margin-top:15px;padding:12px;border-radius:10px;font-size:12px;text-align:center;line-height:1.5;}
.status.success{display:block;background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.25);color:#86efac;}
.status.error{display:block;background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.25);color:#fca5a5;}
</style>
</head>
<body>

<div class="box">
  <div class="brand-title">💎 SMART MONEY</div>
  <h2>Forgot Password?</h2>
  <p>Enter your registered email address. We will send you a secure password reset link.</p>

  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="forgotEmail" class="input-field" placeholder="name@example.com" autocomplete="email" required>
  </div>

  <button onclick="sendResetLink()" class="btn-action" id="resetBtn">Send Reset Link</button>
  <div id="statusBox" class="status"></div>
  <a href="login.html" class="back-link">← Back to Login</a>
</div>

<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://rvprrulkjegvicbnjuft.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_IdI5j4Q4qcd-1knRMVeGKw_O3Ek42ZJ";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

function showStatus(message, type) {
  const box = document.getElementById("statusBox");
  box.innerText = message;
  box.className = "status " + type;
}

async function sendResetLink() {
  const email = document.getElementById("forgotEmail").value.trim().toLowerCase();
  const btn = document.getElementById("resetBtn");

  if (!email) {
    showStatus("Please enter your email address.", "error");
    return;
  }

  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailPattern.test(email)) {
    showStatus("Please enter a valid email address.", "error");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Sending Reset Link...";
  document.getElementById("statusBox").className = "status";

  try {
    // Current Domain URL dynamically detect hoga (Netlify aur GitHub Pages dono ke liye)
    const currentOrigin = window.location.origin;
    const redirectUrl = `${currentOrigin}/update-password.html`;

    // Purely Supabase Auth Password Reset
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { 
      redirectTo: redirectUrl 
    });

    if (error) throw error;

    showStatus("✓ A secure password reset link has been sent to your email. Please check your Gmail inbox and spam folder.", "success");
    btn.innerText = "Reset Link Sent ✓";

    setTimeout(() => {
      btn.disabled = false;
      btn.innerText = "Send Reset Link";
    }, 5000);

  } catch (err) {
    console.error("Password Reset Error:", err);
    showStatus("Error: " + (err.message || "Unable to send reset link. Please try again."), "error");
    btn.disabled = false;
    btn.innerText = "Send Reset Link";
  }
}

document.getElementById("forgotEmail").addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    event.preventDefault();
    sendResetLink();
  }
});
</script>
</body>
</html>
