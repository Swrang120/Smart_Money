<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Money - Forgot Password OTP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<style>
*{box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;}
body{
  margin:0;
  background: radial-gradient(circle at 15% 10%, rgba(124,58,237,.30), transparent 40%),
              radial-gradient(circle at 85% 80%, rgba(59,130,246,.18), transparent 40%),
              linear-gradient(135deg, #080a12, #111426, #080a12);
  color:#ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:20px;
}
.box{
  width:100%;
  max-width:420px;
  background:#11131c;
  padding:35px 30px;
  border-radius:24px;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 20px 50px rgba(0,0,0,.60);
}
.brand-title{text-align:center;font-size:22px;font-weight:800;color:#ffffff;margin-bottom:8px;text-shadow:0 0 15px rgba(168,85,247,.50);}
h2{margin:10px 0 10px;color:#ffffff;font-weight:800;text-align:center;font-size:20px;}
p{font-size:13px;color:#9ca3af;margin-bottom:25px;text-align:center;line-height:1.6;}
.form-group{text-align:left;margin-bottom:20px;}
.form-group label{font-size:12px;font-weight:700;color:#c4b5fd;display:block;margin-bottom:8px;letter-spacing:.5px;}
.input-field{
  width:100%;
  padding:13px 16px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);
  color:#ffffff;
  outline:none;
  font-size:14px;
  transition:.3s;
}
.input-field:focus{border-color:#8b5cf6;box-shadow:0 0 10px rgba(139,92,246,.30);}
.btn-action{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  color:#ffffff;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(135deg, #7c3aed, #6d28d9);
  font-size:14px;
  box-shadow:0 8px 20px rgba(124,58,237,.40);
  transition:.2s;
}
.btn-action:hover{opacity:.90;}
.btn-action:disabled{opacity:.60;cursor:not-allowed;}
.back-link{display:block;text-align:center;margin-top:20px;font-size:13px;color:#a78bfa;text-decoration:none;font-weight:700;}
.back-link:hover{text-decoration:underline;}
.status{display:none;margin-top:15px;padding:12px;border-radius:10px;font-size:12px;text-align:center;line-height:1.5;}
.status.success{display:block;background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.25);color:#86efac;}
.status.error{display:block;background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.25);color:#fca5a5;}
.hidden{display:none;}
</style>
</head>

<body>

<div class="box">
  <div class="brand-title">💎 SMART MONEY</div>
  <h2>Forgot Password</h2>
  <p id="instructionText">Enter your registered email address to receive a 6-digit verification OTP.</p>

  <!-- Step 1: Email Input Form -->
  <div id="emailStep">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="forgotEmail" class="input-field" placeholder="name@example.com" autocomplete="email" required>
    </div>
    <button onclick="sendOtp()" class="btn-action" id="sendBtn">Send OTP</button>
  </div>

  <!-- Step 2: OTP Verification Form (Hidden Initially) -->
  <div id="otpStep" class="hidden">
    <div class="form-group">
      <label>Enter 6-Digit OTP</label>
      <input type="text" id="otpInput" class="input-field" placeholder="123456" maxlength="6">
    </div>
    <button onclick="verifyOtp()" class="btn-action" id="verifyBtn">Verify OTP</button>
  </div>

  <div id="statusBox" class="status"></div>

  <a href="login.html" class="back-link">← Back to Login</a>
</div>

<script>
/* =========================================
   EMAILJS INITIALIZATION
========================================= */
emailjs.init("nD7bbMhcvotO19ODK");

let generatedOtp = "";
let userEmail = "";

function showStatus(message, type) {
  const box = document.getElementById("statusBox");
  box.innerText = message;
  box.className = "status " + type;
}

/* =========================================
   SEND OTP VIA EMAILJS
========================================= */
async function sendOtp() {
  userEmail = document.getElementById("forgotEmail").value.trim().toLowerCase();
  const btn = document.getElementById("sendBtn");

  if (!userEmail) {
    showStatus("Please enter your email address.", "error");
    return;
  }

  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailPattern.test(userEmail)) {
    showStatus("Please enter a valid email address.", "error");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Sending OTP...";
  document.getElementById("statusBox").className = "status";

  // Generate 6-digit random OTP
  generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();

  const templateParams = {
    to_name: userEmail.split('@')[0],
    to_email: userEmail,
    otp_code: generatedOtp,
    reset_link: "Use this OTP: " + generatedOtp
  };

  try {
    // Send using your EmailJS credentials
    await emailjs.send("service_4q2gu5k", "template_eh1e4fr", templateParams);

    showStatus("✓ OTP sent successfully to your email! Please check your inbox and spam.", "success");
    
    // Switch to OTP entry view
    document.getElementById("emailStep").classList.add("hidden");
    document.getElementById("otpStep").classList.remove("hidden");
    document.getElementById("instructionText").innerText = "Enter the 6-digit verification code sent to " + userEmail;

  } catch (err) {
    console.error("EmailJS Error:", err);
    showStatus("Error: Unable to send OTP. Please check your network or try again.", "error");
    btn.disabled = false;
    btn.innerText = "Send OTP";
  }
}

/* =========================================
   VERIFY ENTERED OTP
========================================= */
function verifyOtp() {
  const enteredOtp = document.getElementById("otpInput").value.trim();
  const verifyBtn = document.getElementById("verifyBtn");

  if (!enteredOtp || enteredOtp.length !== 6) {
    showStatus("Please enter a valid 6-digit OTP.", "error");
    return;
  }

  if (enteredOtp === generatedOtp) {
    showStatus("✓ OTP Verified Successfully! Redirecting...", "success");
    verifyBtn.innerText = "Verified ✓";
    
    // Save email temporarily so update-password page knows who is changing password
    localStorage.setItem("reset_email", userEmail);

    setTimeout(() => {
      window.location.href = "update-password.html";
    }, 2000);
  } else {
    showStatus("Invalid OTP. Please check and try again.", "error");
  }
}
</script>

</body>
</html>
