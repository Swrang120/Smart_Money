<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Money - Forgot Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

<!-- EmailJS Library -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<style>
* { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
body { 
  margin: 0; 
  background: radial-gradient(circle at 15% 10%, rgba(124,58,237,0.3), transparent 40%), linear-gradient(135deg, #080a12, #111426, #080a12); 
  color: #ffffff; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  min-height: 100vh; 
  padding: 20px; 
}
.box { 
  width: 100%; 
  max-width: 420px; 
  background: #11131c; 
  padding: 35px 30px; 
  border-radius: 24px; 
  border: 1px solid rgba(255,255,255,0.08); 
  box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
}
.brand-title {
  text-align: center;
  font-size: 22px;
  font-weight: 800;
  color: #ffffff;
  margin-bottom: 5px;
  text-shadow: 0 0 15px rgba(168,85,247,0.5);
}
h2 { 
  margin-top: 10px; 
  color: #ffffff; 
  font-weight: 800; 
  text-align: center; 
  font-size: 20px;
}
p { 
  font-size: 13px; 
  color: #9ca3af; 
  margin-bottom: 25px; 
  text-align: center; 
  line-height: 1.5;
}
.form-group {
  text-align: left;
  margin-bottom: 20px;
}
.form-group label {
  font-size: 12px;
  font-weight: 700;
  color: #c4b5fd;
  display: block;
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}
.input-field { 
  width: 100%; 
  padding: 13px 16px; 
  border-radius: 12px; 
  border: 1px solid rgba(255,255,255,0.12); 
  background: rgba(255,255,255,0.04);
  color: #ffffff;
  outline: none; 
  font-size: 14px; 
  transition: all 0.3s ease;
}
.input-field:focus {
  border-color: #8b5cf6;
  box-shadow: 0 0 10px rgba(139,92,246,0.3);
}
.btn-action { 
  width: 100%; 
  padding: 14px; 
  border: none; 
  border-radius: 12px; 
  color: #fff; 
  font-weight: 700; 
  cursor: pointer; 
  background: linear-gradient(135deg, #7c3aed, #6d28d9); 
  font-size: 14px; 
  box-shadow: 0 8px 20px rgba(124,58,237,0.4);
  transition: opacity 0.2s;
}
.btn-action:hover { opacity: 0.9; }
.back-link { 
  display: block; 
  text-align: center; 
  margin-top: 20px; 
  font-size: 13px; 
  color: #a78bfa; 
  text-decoration: none; 
  font-weight: 700; 
}
.back-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="box">
  <div class="brand-title">💎 SMART MONEY</div>
  <h2>Forgot Password?</h2>
  <p>Enter your registered email address to receive your secure password reset instructions.</p>
  
  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="forgotEmail" class="input-field" placeholder="name@example.com" required>
  </div>
  
  <button onclick="sendForgotEmailJS()" class="btn-action" id="resetBtn">Send Reset Link</button>
  <a href="login.html" class="back-link">← Back to Login</a>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // EmailJS Initialization (Using your official Public Key)
  emailjs.init("nD7bbMhcvotO19ODK");

  // Supabase Setup
  const SUPABASE_URL = "https://rvprrulkjegvicbnjuft.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_IdI5j4Q4qcd-1knRMVeGKw_O3Ek42ZJ";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  async function sendForgotEmailJS() {
    const email = document.getElementById("forgotEmail").value.trim();
    const btn = document.getElementById("resetBtn");

    if(!email){
      alert("Please enter your email address!");
      return;
    }

    btn.disabled = true;
    btn.innerText = "Processing...";

    try {
      // 1. Supabase se secure reset link generate karwayenge
      const updatePageUrl = window.location.origin + "/update-password.html";
      
      const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: updatePageUrl,
      });

      if (error) throw error;

      // 2. EmailJS ke through custom styled email trigger karna (Using your Service ID & New Template ID)
      const templateParams = {
        to_name: email.split('@')[0], // Email se naam extract karke daal dega
        to_email: email,
        reset_link: updatePageUrl
      };

      // Service ID: service_a678nhs | Template ID: template_eh1e4fr
      await emailjs.send("service_a678nhs", "template_eh1e4fr", templateParams);

      alert("🎉 Password reset instructions have been sent to your email!");
      window.location.href = "login.html";

    } catch (err) {
      alert("Error: " + err.message);
      btn.disabled = false;
      btn.innerText = "Send Reset Link";
    }
  }
</script>
</body>
</html>
