name: Deploy Smart Money Social to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "social/**"
      - ".github/workflows/deploy-social-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "smart-money-social-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Social website
        uses: actions/upload-pages-artifact@v3
        with:
          path: social

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
