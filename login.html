<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Money</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- EmailJS Library -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .auth-card {
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
      text-align: center;
    }
    .auth-logo {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #7c3aed;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2);
      background: #fff;
    }
    .auth-header {
      margin-bottom: 25px;
    }
    .auth-header h2 {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 5px;
    }
    .auth-header p {
      font-size: 13px;
      color: #64748b;
    }
    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }
    .input-field {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .input-field:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
    }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    .btn-submit:hover { opacity: 0.9; }
    
    .forgot-link-wrap {
      text-align: right;
      margin-top: -10px;
      margin-bottom: 15px;
    }
    .forgot-link-wrap a {
      font-size: 12px;
      color: #7c3aed;
      text-decoration: none;
      font-weight: 600;
    }
    .forgot-link-wrap a:hover { text-decoration: underline; }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #64748b;
    }
    .auth-footer a {
      color: #7c3aed;
      font-weight: 600;
      text-decoration: none;
    }

    /* MODAL STYLES FOR FORGOT PASSWORD */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6); z-index: 999; justify-content: center; align-items: center; backdrop-filter: blur(3px); padding: 15px;
    }
    .modal-box {
      background: #ffffff; padding: 25px; border-radius: 20px; width: 100%; max-width: 380px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: left;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <!-- Dynamic Logo Loaded from Admin Panel Database -->
    <img id="dynamicLogoImg" src="1000819130.jpg" alt="Smart Money Logo" class="auth-logo" onerror="this.src='https://via.placeholder.com/100?text=SM'">
    
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Login to your Smart Money account</p>
    </div>

    <div class="input-group">
      <label>Email Address</label>
      <input type="email" id="loginEmail" class="input-field" placeholder="Enter your email">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="loginPassword" class="input-field" placeholder="Enter your password">
    </div>

    <div class="forgot-link-wrap">
      <a href="javascript:void(0)" onclick="openForgotModal()">Forgot Password?</a>
    </div>

    <button onclick="handleLogin()" class="btn-submit" id="loginBtn">Login Now</button>

    <div class="auth-footer">
      Want to buy a package? <a href="index.html">Go to Home</a>
    </div>
  </div>

  <!-- FORGOT PASSWORD MODAL -->
  <div id="forgotModal" class="modal-overlay">
    <div class="modal-box">
      <h3 style="margin-top:0; font-size:18px; color:#0f172a; margin-bottom: 8px;">🔑 Reset Password</h3>
      <p style="font-size: 12.5px; color: #64748b; margin-bottom: 15px;">Apni registered Gmail ID enter karein. Hum aapko password reset karne ka direct link bhejenge.</p>
      
      <label style="font-size:12px; font-weight:600; color:#475569;">Email Address</label>
      <input type="email" id="forgotEmail" class="input-field" placeholder="e.g. yourname@gmail.com" style="margin-top: 5px; margin-bottom: 15px;">
      
      <button onclick="sendPasswordResetLink()" class="btn-submit" id="resetBtn" style="margin-top: 0;">Send Reset Link</button>
      <button onclick="closeModal('forgotModal')" style="width:100%; background:transparent; color:#64748b; border:none; padding:10px; margin-top:8px; cursor:pointer; font-weight: 600;">Cancel</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // EmailJS Initialization with your Public Key
    emailjs.init("nD7bbMhcvotO19ODK");

    const SUPABASE_URL = "https://rvprrulkjegvicbnjuft.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_IdI5j4Q4qcd-1knRMVeGKw_O3Ek42ZJ";
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });

    document.addEventListener("DOMContentLoaded", async function() {
      try {
        const { data: logoData } = await supabaseClient.from('global_settings').select('setting_value').eq('setting_key', 'admin_top_logo').maybeSingle();
        if (logoData && logoData.setting_value) {
          document.getElementById("dynamicLogoImg").src = logoData.setting_value;
        }

        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          window.location.href = "dashboard.html";
        }
      } catch (err) {
        console.log("Initialization error:", err);
      }
    });

    async function handleLogin() {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();
      const btn = document.getElementById("loginBtn");

      if (!email || !password) {
        alert("Please fill in both email and password.");
        return;
      }

      btn.innerText = "Logging in...";
      btn.disabled = true;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) throw error;

        alert("🎉 Login Successful!");
        window.location.href = "dashboard.html";
      } catch (err) {
        alert("Login Failed: " + err.message);
        btn.innerText = "Login Now";
        btn.disabled = false;
      }
    }

    function openForgotModal() {
      document.getElementById("forgotModal").style.display = "flex";
    }

    function closeModal(id) {
      document.getElementById(id).style.display = "none";
    }

    async function sendPasswordResetLink() {
      const email = document.getElementById("forgotEmail").value.trim();
      const btn = document.getElementById("resetBtn");

      if (!email) {
        alert("Please enter your registered email address.");
        return;
      }

      btn.innerText = "Sending Link...";
      btn.disabled = true;

      try {
        const updatePageUrl = window.location.origin + '/update-password.html';

        // 1. Supabase Auth se reset link generate karwayenge
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: updatePageUrl,
        });

        if (error) throw error;

        // 2. EmailJS ke zariye aapke Support Gmail aur naye Template se mail trigger karenge
        const templateParams = {
          to_name: email.split('@')[0],
          to_email: email,
          reset_link: updatePageUrl
        };

        await emailjs.send("service_a678nhs", "template_eh1e4fr", templateParams);

        alert("🎉 Password reset link successfully sent to your Gmail inbox!");
        closeModal('forgotModal');
        document.getElementById("forgotEmail").value = "";
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        btn.innerText = "Send Reset Link";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
