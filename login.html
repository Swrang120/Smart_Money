<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Money</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #090d16;
      background-image: radial-gradient(circle at 50% 20%, #1e293b 0%, #090d16 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .auth-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 35px 25px;
      border-radius: 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4),
                  inset 0 1px 0 rgba(255,255,255,0.1);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      position: relative;
    }

    .husky-container {
      position: relative;
      width: 110px;
      height: 100px;
      margin: -65px auto 10px auto;
      z-index: 10;
    }

    .auth-logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      background: #1e293b;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 3px solid rgba(255,255,255,0.15);
      transition: transform 0.3s ease;
    }

    .auth-logo:hover {
      transform: scale(1.05);
    }

    .auth-header {
      margin-bottom: 22px;
    }

    .auth-header h2 {
      font-size: 26px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .auth-header p {
      font-size: 13px;
      color: #94a3b8;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(30, 41, 59, 0.6);
      color: #f1f5f9;
      font-size: 14px;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .input-field::placeholder {
      color: #64748b;
    }

    .input-field:focus {
      border-color: #3b82f6;
      background: rgba(30, 41, 59, 0.9);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    .password-toggle {
      position: absolute;
      right: 16px;
      top: 41px;
      cursor: pointer;
      color: #64748b;
      font-size: 16px;
      user-select: none;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .remember-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      cursor: pointer;
    }

    .remember-wrap input[type="checkbox"] {
      accent-color: #3b82f6;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .forgot-link-wrap a {
      font-size: 13px;
      color: #60a5fa;
      text-decoration: none;
      font-weight: 500;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
      margin-top: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .door-icon-box {
      width: 20px;
      height: 20px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #64748b;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .divider::before {
      margin-right: 10px;
    }

    .divider::after {
      margin-left: 10px;
    }

    .social-btns {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .social-btn {
      flex: 1;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 11px;
      border-radius: 12px;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .auth-footer {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #94a3b8;
    }

    .auth-footer a {
      color: #60a5fa;
      font-weight: 500;
      text-decoration: none;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 13, 22, 0.8);
      z-index: 999;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(6px);
      padding: 15px;
    }

    .modal-box {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 25px;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      text-align: left;
    }
  </style>
</head>

<body>

<div class="auth-card">

  <div class="husky-container">
    <img
      id="dynamicLogoImg"
      src="1000819130.jpg"
      alt="Smart Money Logo"
      class="auth-logo"
    >
  </div>

  <div class="auth-header">
    <h2>Welcome Back</h2>
    <p>Sign in securely to your account.</p>
  </div>

  <div class="input-group">
    <label for="loginEmail">Email Address</label>

    <input
      type="email"
      id="loginEmail"
      class="input-field"
      placeholder="Enter your email"
    >
  </div>

  <div class="input-group">

    <label for="loginPassword">Password</label>

    <input
      type="password"
      id="loginPassword"
      class="input-field"
      placeholder="••••••••"
    >

    <span
      class="password-toggle"
      id="togglePasswordBtn"
      onclick="togglePasswordVisibility()"
    >
      👁️
    </span>

  </div>

  <div class="form-options">

    <label class="remember-wrap">

      <input
        type="checkbox"
        id="rememberMe"
      >

      Remember me

    </label>

    <div class="forgot-link-wrap">

      <a
        href="javascript:void(0)"
        onclick="openForgotModal()"
      >
        Forgot password?
      </a>

    </div>

  </div>

  <button
    onclick="handleLogin()"
    class="btn-submit"
    id="loginBtn"
  >

    <span>Sign in</span>

    <div class="door-icon-box">
      🚪
    </div>

  </button>

  <div class="divider">
    or continue with
  </div>

  <div class="social-btns">

    <button
      type="button"
      class="social-btn"
      onclick="socialLogin('Google')"
    >
      Google
    </button>

    <button
      type="button"
      class="social-btn"
      onclick="socialLogin('Apple')"
    >
      Apple
    </button>

  </div>

  <div class="auth-footer">

    New to Smart Money?

    <a href="index.html">
      Create account
    </a>

  </div>

</div>


<!-- FORGOT PASSWORD MODAL -->

<div
  id="forgotModal"
  class="modal-overlay"
>

  <div class="modal-box">

    <h3 style="color:#f8fafc;margin-bottom:8px;">
      🔑 Reset Password
    </h3>

    <p
      style="
      font-size:12.5px;
      color:#94a3b8;
      margin-bottom:15px;
      "
    >
      Apni registered Email ID enter karein.
    </p>

    <label
      for="forgotEmail"
      style="
      font-size:12px;
      color:#94a3b8;
      "
    >
      EMAIL ADDRESS
    </label>

    <input
      type="email"
      id="forgotEmail"
      class="input-field"
      placeholder="yourname@gmail.com"
      style="margin-top:6px;margin-bottom:15px;"
    >

    <button
      onclick="sendPasswordResetLink()"
      class="btn-submit"
      id="resetBtn"
    >
      Send Reset Link
    </button>

    <button
      onclick="closeModal('forgotModal')"
      style="
      width:100%;
      background:transparent;
      color:#94a3b8;
      border:none;
      padding:10px;
      margin-top:8px;
      cursor:pointer;
      "
    >
      Cancel
    </button>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://rvprrulkjegvicbnjuft.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_IdI5j4Q4qcd-1knRMVeGKw_O3Ek42ZJ";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true
    }
  }
);


/* LOAD LOGO */

document.addEventListener(
"DOMContentLoaded",
async function () {

  try {

    const { data: logoData } =
    await supabaseClient
    .from("global_settings")
    .select("setting_value")
    .eq(
      "setting_key",
      "admin_top_logo"
    )
    .maybeSingle();


    if (
      logoData &&
      logoData.setting_value
    ) {

      document
      .getElementById("dynamicLogoImg")
      .src =
      logoData.setting_value;

    }

  }
  catch (err) {

    console.log(
      "Logo load error:",
      err
    );

  }

}
);


/* PASSWORD SHOW HIDE */

function togglePasswordVisibility() {

  const pwdInput =
  document.getElementById(
    "loginPassword"
  );

  const toggleBtn =
  document.getElementById(
    "togglePasswordBtn"
  );


  if (
    pwdInput.type === "password"
  ) {

    pwdInput.type = "text";

    toggleBtn.textContent =
    "🙈";

  }
  else {

    pwdInput.type =
    "password";

    toggleBtn.textContent =
    "👁️";

  }

}


/* LOGIN FUNCTION */

async function handleLogin() {

  const emailInput =
  document
  .getElementById("loginEmail")
  .value
  .trim()
  .toLowerCase();


  const password =
  document
  .getElementById("loginPassword")
  .value
  .trim();


  const btn =
  document.getElementById(
    "loginBtn"
  );


  if (
    !emailInput ||
    !password
  ) {

    alert(
      "⚠️ Kripya Email aur Password bharein!"
    );

    return;

  }


  btn.querySelector("span").innerText =
  "Checking Access...";

  btn.disabled = true;


  try {


    /* CHECK USER FROM DATABASE */

    const {
      data,
      error
    } =
    await supabaseClient
    .from("payment_requests")
    .select("*")
    .eq(
      "email",
      emailInput
    )
    .eq(
      "password",
      password
    )
    .maybeSingle();



    /* INVALID LOGIN */

    if (
      error ||
      !data
    ) {

      alert(
        "⚠️ Invalid Email or Password!"
      );

      resetLoginButton();

      return;

    }



    /* PENDING */

    if (
      data.status ===
      "Pending"
    ) {

      alert(
        "⏳ Aapka payment abhi Admin verification mein hai."
      );

      resetLoginButton();

      return;

    }



    /* REJECTED */

    if (
      data.status ===
      "Rejected"
    ) {

      alert(
        "❌ Aapka payment request reject kar diya gaya hai."
      );

      resetLoginButton();

      return;

    }



    /* APPROVED LOGIN */

    if (
      data.status ===
      "Approved"
    ) {


      /*
      IMPORTANT SESSION STORAGE
      */


      localStorage.setItem(
        "isLoggedIn",
        "true"
      );


      localStorage.setItem(
        "userData",
        JSON.stringify(data)
      );


      localStorage.setItem(
        "loginTime",
        Date.now().toString()
      );


      /*
      REMEMBER EMAIL
      */


      const rememberMe =
      document.getElementById(
        "rememberMe"
      ).checked;


      if (rememberMe) {

        localStorage.setItem(
          "rememberedEmail",
          emailInput
        );

      }
      else {

        localStorage.removeItem(
          "rememberedEmail"
        );

      }


      console.log(
        "Login successful:",
        data
      );


      alert(
        "🎉 Login Successful!"
      );


      /*
      GO TO DASHBOARD
      */

      window.location.href =
      "dashboard.html";


      return;

    }


  }
  catch (err) {


    console.error(
      "Login Error:",
      err
    );


    alert(
      "⚠️ Login mein kuch samasya aayi. Dubara koshish karein."
    );


    resetLoginButton();


  }

}



/* RESET LOGIN BUTTON */

function resetLoginButton() {

  const btn =
  document.getElementById(
    "loginBtn"
  );


  btn.querySelector("span").innerText =
  "Sign in";


  btn.disabled =
  false;

}



/* SOCIAL LOGIN */

function socialLogin(provider) {

  alert(
    provider +
    " login integration can be linked via Supabase OAuth providers!"
  );

}



/* FORGOT PASSWORD */

function openForgotModal() {

  document
  .getElementById("forgotModal")
  .style.display =
  "flex";

}


function closeModal(id) {

  document
  .getElementById(id)
  .style.display =
  "none";

}



/* PASSWORD RESET */

async function sendPasswordResetLink() {


  const email =
  document
  .getElementById(
    "forgotEmail"
  )
  .value
  .trim()
  .toLowerCase();


  const btn =
  document.getElementById(
    "resetBtn"
  );


  if (!email) {

    alert(
      "Please enter your registered email address."
    );

    return;

  }


  btn.innerText =
  "Sending Link...";


  btn.disabled =
  true;


  try {


    const updatePageUrl =
    window.location.origin +
    window.location.pathname.replace(
      "login.html",
      "update-password.html"
    );


    const {
      error
    } =
    await supabaseClient
    .auth
    .resetPasswordForEmail(
      email,
      {
        redirectTo:
        updatePageUrl
      }
    );


    if (error)
      throw error;


    alert(
      "🎉 Password reset link successfully sent!"
    );


    closeModal(
      "forgotModal"
    );


    document
    .getElementById(
      "forgotEmail"
    )
    .value =
    "";


  }
  catch (err) {


    console.error(
      "Reset Error:",
      err
    );


    alert(
      "Error: " +
      (
        err.message ||
        "Could not send reset link."
      )
    );


  }
  finally {


    btn.innerText =
    "Send Reset Link";


    btn.disabled =
    false;


  }


}


/* AUTO FILL REMEMBERED EMAIL */

document.addEventListener(
"DOMContentLoaded",
function () {

  const rememberedEmail =
  localStorage.getItem(
    "rememberedEmail"
  );


  if (rememberedEmail) {

    document
    .getElementById(
      "loginEmail"
    )
    .value =
    rememberedEmail;


    document
    .getElementById(
      "rememberMe"
    )
    .checked =
    true;

  }

});

</script>

</body>
</html>
