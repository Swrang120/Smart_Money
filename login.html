<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Smart Money</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">

    <div class="logo">Smart Money</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="register.html">Register</a>
    </nav>

  </header>


  <main class="form-page">

    <div class="form-box">

      <h1>Welcome Back</h1>

      <p>Login to your Smart Money account</p>


      <form id="loginForm">

        <label for="email">Gmail</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your Gmail"
          required
        >


        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >


        <button
          type="submit"
          class="btn login-btn"
        >
          Login
        </button>

      </form>


      <p class="login-text">

        Don't have an account?

        <a href="register.html">
          Create Account
        </a>

      </p>

    </div>

  </main>


  <!-- SUPABASE LIBRARY -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- LOGIN SYSTEM -->
  <script>

    const SUPABASE_URL =
      "https://rvprrulkjegvicbnjuft.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_IdI5j4Q4qcd-1knRMVeGKw_O3Ek42ZJ";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const loginForm =
      document.getElementById("loginForm");


    const loginButton =
      document.querySelector(".login-btn");


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        loginButton.disabled = true;

        loginButton.textContent =
          "Logging in...";


        try {

          const { data, error } =
            await supabaseClient
              .auth
              .signInWithPassword({

                email: email,

                password: password

              });


          if (error) {
            throw error;
          }


          if (!data.user) {
            throw new Error(
              "Login failed."
            );
          }


          alert(
            "Login successful!"
          );


          window.location.href =
            "dashboard.html";


        } catch (error) {

          alert(
            "Login failed: " +
            error.message
          );


        } finally {

          loginButton.disabled = false;

          loginButton.textContent =
            "Login";

        }

      }
    );

  </script>

</body>

</html>
