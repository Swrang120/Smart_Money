<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Money · Secure Checkout</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;background:radial-gradient(circle at top,#24204b,#080d1c 65%);color:#f8fafc;font-family:system-ui,-apple-system,sans-serif}.card{width:min(100%,480px);padding:26px;border:1px solid #3d4268;border-radius:24px;background:#11182b;box-shadow:0 25px 70px #0007}.brand{text-align:center;color:#c4b5fd;font-size:12px;font-weight:900;letter-spacing:3px}h1{text-align:center;font-size:24px;margin:10px 0}.muted{text-align:center;color:#a5b4cc;font-size:13px;line-height:1.6}.amount{margin:22px 0;padding:18px;border-radius:16px;background:#0b1222;border:1px solid #303a5b;text-align:center}.amount small{display:block;color:#9ba8c3}.amount strong{display:block;margin-top:4px;font-size:32px;color:#5eead4}.details{font-size:13px;color:#cbd5e1;line-height:1.9}.btn{width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(120deg,#8b5cf6,#4f46e5);color:white;font-size:15px;font-weight:800;margin-top:18px;cursor:pointer}.btn:disabled{opacity:.6}.alt{display:block;text-align:center;margin-top:16px;color:#c4b5fd;font-size:12px}.notice{display:none;padding:12px;border-radius:12px;margin-top:15px;font-size:13px;line-height:1.5}.notice.show{display:block}.err{background:#451a24;color:#fecdd3}.ok{background:#064e3b;color:#d1fae5}.safe{color:#8190ad;text-align:center;font-size:10px;margin-top:18px}
</style></head><body><main class="card">
<div class="brand">SMART MONEY</div><h1>Secure Package Payment</h1><p class="muted">Complete your payment through Razorpay's secure checkout.</p>
<div class="amount"><small id="pkg">Selected package</small><strong id="price">₹0</strong></div>
<div class="details" id="details">Checking your checkout details…</div>
<div id="notice" class="notice"></div>
<button id="pay" class="btn" disabled>Loading secure checkout…</button>
<a class="alt" href="payment.html">Prefer the existing UPI / screenshot payment method?</a>
<div class="safe">🔒 Your Razorpay secret is never exposed in this page.</div>
</main>
<script>
const SUPABASE_URL="https://rvprrulkjegvicbnjuft.supabase.co";
const SUPABASE_KEY="sb_publishable_IdI5j4Q4qcd-1knRMVeGKw_O3Ek42ZJ";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let checkout={};try{checkout=JSON.parse(sessionStorage.getItem("checkout_data")||"{}")}catch(e){}
const pkgName=String(checkout.name||"").trim(),amount=Number(String(checkout.price||"").replace(/[₹,\s]/g,""));
const notice=document.getElementById("notice"),btn=document.getElementById("pay");
function message(s,ok=false){notice.textContent=s;notice.className="notice show "+(ok?"ok":"err")}
function rupees(n){return "₹"+Number(n).toLocaleString("en-IN")}
document.getElementById("pkg").textContent=pkgName||"Package not selected";
document.getElementById("price").textContent=rupees(amount||0);
(async()=>{
 const {data:{session},error}=await sb.auth.getSession();
 if(error||!session?.user){document.getElementById("details").textContent="Your account session is missing. Please return to checkout and sign in again.";message("Please restart checkout so the payment can be linked to your account.");return}
 if(!pkgName||!Number.isFinite(amount)||amount<=0){message("Invalid package details. Return to package selection and try again.");return}
 document.getElementById("details").innerHTML="Account: "+String(session.user.email||checkout.email||"").replace(/[&<>"]/g,"")+"<br>Package: "+pkgName+"<br>Payment status: will be verified securely before the request is submitted.";
 btn.disabled=false;btn.textContent="Pay "+rupees(amount)+" with Razorpay";
 btn.onclick=()=>startPayment(session.user);
})();
async function startPayment(user){
 btn.disabled=true;btn.textContent="Creating secure order…";
 try{
  const orderRes=await fetch("/api/razorpay/create-order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({packageName:pkgName,amount,userId:user.id,email:checkout.email||user.email,mobile:checkout.mobile||""})});
  const order=await orderRes.json();if(!orderRes.ok)throw new Error(order.error||"Unable to create payment order.");
  const options={key:order.keyId,amount:order.amount,currency:order.currency,name:"Smart Money",description:pkgName,order_id:order.orderId,
   prefill:{name:checkout.fullname||"",email:checkout.email||user.email||"",contact:checkout.mobile||""},
   theme:{color:"#7c3aed"},
   handler:async function(response){
    try{
     btn.textContent="Verifying payment…";
     const vr=await fetch("/api/razorpay/verify-payment",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(response)});
     const verified=await vr.json();if(!vr.ok||!verified.verified)throw new Error(verified.error||"Payment verification failed.");
     const paymentRecord={user_id:user.id,full_name:checkout.fullname||"",email:checkout.email||user.email||"",mobile:checkout.mobile||"",referral_id:checkout.ref||"",package_name:pkgName,package_price:amount,amount,transaction_id:response.razorpay_payment_id,payment_status:"Pending",admin_note:"Razorpay signature verified; pending admin approval.",screenshot_name:null,status:"Pending",is_deleted:false,payment_method:"Razorpay"};
     const {error:insertError}=await sb.from("payment_requests").insert([paymentRecord]);
     if(insertError)throw new Error("Payment verified, but the request could not be saved. Contact Smart Money support with Payment ID "+response.razorpay_payment_id+".");
     sessionStorage.removeItem("checkout_data");message("Payment verified successfully! Your package request is now pending admin approval. Payment ID: "+response.razorpay_payment_id,true);
     btn.textContent="Payment verified ✓";btn.disabled=true;
    }catch(e){message(e.message||"Verification could not be completed. Please contact support.");btn.disabled=false;btn.textContent="Retry verification";}
   },
   modal:{ondismiss:()=>{btn.disabled=false;btn.textContent="Pay "+rupees(amount)+" with Razorpay";}},
   notes:{package_name:pkgName,user_id:user.id}
  };
  const rzp=new Razorpay(options);rzp.on("payment.failed",e=>{message((e.error&&e.error.description)||"Payment failed. No package request was submitted.");btn.disabled=false;btn.textContent="Try payment again";});rzp.open();
 }catch(e){message(e.message||"Unable to start payment.");btn.disabled=false;btn.textContent="Pay "+rupees(amount)+" with Razorpay";}
}
</script></body></html>
