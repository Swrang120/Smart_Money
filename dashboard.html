<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

  <h2>User Dashboard</h2>
  <p>Email: <span id="userEmail">Loading...</span></p>
  <p>Balance: <span id="walletBalance">₹0</span></p>

  <h3>Withdrawal History</h3>
  <div id="withdrawalHistoryList">Loading history...</div>

  <br>
  <button onclick="requestWithdrawal()">Withdraw ₹100</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
emailjs.init("FxcimUvl0-ZxAauRx");

const SUPABASE_URL = "https://rvprrulkjegvicbnjuft.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_IdI5j4Q4qcd-1knRMVeGKw_O3Ek42ZJ";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let currentUserId = null;
let currentUserEmail = "";
let lastKnownStatuses = {};

document.addEventListener("DOMContentLoaded", async function(){
  const { data:{ session } } = await supabaseClient.auth.getSession();
  if(!session){
    window.location.href = "login.html";
    return;
  }

  currentUserId = session.user.id;
  currentUserEmail = session.user.email;
  document.getElementById("userEmail").innerText = currentUserEmail;

  // Fetch Profile Balance
  let { data: profile } = await supabaseClient.from("profiles").select("*").eq("user_id", currentUserId).single();
  if(profile){
    document.getElementById("walletBalance").innerText = "₹" + (profile.balance || 0);
  }

  loadHistory();
  setupRealtime();
});

async function loadHistory(){
  let { data } = await supabaseClient.from("withdrawal_requests").select("*").eq("user_id", currentUserId).order("created_at", { ascending: false });
  const container = document.getElementById("withdrawalHistoryList");
  
  if(!data || data.length === 0){
    container.innerHTML = "No history found.";
    return;
  }

  let html = "<ul>";
  data.forEach(item => {
    let st = (item.status || "").toLowerCase();
    lastKnownStatuses[item.id] = st;
    html += `<li>Amount: ₹${item.amount} - Status: <b>${item.status}</b></li>`;
  });
  html += "</ul>";
  container.innerHTML = html;
}

function setupRealtime(){
  supabaseClient
    .channel('public:withdrawal_requests')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'withdrawal_requests', filter: `user_id=eq.${currentUserId}` }, payload => {
      const updated = payload.new;
      const oldStatus = lastKnownStatuses[updated.id];
      const newStatus = (updated.status || "").toLowerCase();

      // Agar status approved/success ho gaya toh email bhej do
      if(oldStatus && oldStatus !== "approved" && oldStatus !== "success" && (newStatus === "approved" || newStatus === "success")){
        emailjs.send('service_default', 'template_default', {
          to_email: currentUserEmail,
          amount: updated.amount,
          message: `Your withdrawal of ₹${updated.amount} has been successfully approved!`
        });
      }
      lastKnownStatuses[updated.id] = newStatus;
      loadHistory();
    })
    .subscribe();
}

async function requestWithdrawal(){
  let { error } = await supabaseClient.from("withdrawal_requests").insert({
    user_id: currentUserId,
    amount: 100,
    status: "pending"
  });
  if(error) alert(error.message);
  else {
    alert("Withdrawal requested!");
    loadHistory();
  }
}
</script>
</body>
</html>
