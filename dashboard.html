<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Money Affiliate Dashboard</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- EmailJS CDN -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
        }
        .dashboard-container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--accent);
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 15px;
        }
        .stat-title {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 20px;
            font-weight: 700;
        }
        .btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: var(--accent-hover);
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>Smart Money Dashboard</h1>

        <!-- Admin Updates Section Added Here -->
        <div id="adminStatusContainer" style="background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 15px; margin: 15px 0;">
            <h3 style="margin: 0 0 10px; font-size: 16px; color: var(--accent);">📢 Admin Updates & Status</h3>
            <div id="statusList">Loading updates...</div>
        </div>

        <!-- Stats Overview -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Today's Revenue</div>
                <div class="stat-value" id="todayRev">₹0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Balance</div>
                <div class="stat-value" id="totalBal">₹0.00</div>
            </div>
        </div>

        <!-- Payment Details Form -->
        <div class="card">
            <h3>Payout Settings</h3>
            <form id="payoutForm">
                <label>UPI ID / Bank Details</label>
                <input type="text" id="upiInput" placeholder="Enter your UPI ID">
                <button type="submit" class="btn">Save Details</button>
            </form>
        </div>
    </div>

    <script>
        // Initialize Supabase Client (Apni credentials yahan dalein agar alag hain)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadAdminStatus() {
            const { data, error } = await supabaseClient
                .from('admin_updates')
                .select('*')
                .order('created_at', { ascending: false });

            const container = document.getElementById('statusList');
            if (error || !data || data.length === 0) {
                container.innerHTML = '<p style="color: var(--muted); margin: 0; font-size: 14px;">No updates from admin yet.</p>';
                return;
            }

            container.innerHTML = data.map(item => `
                <div style="border-bottom: 1px solid var(--border); padding: 8px 0;">
                    ${item.title ? `<b>${item.title}</b><br>` : ''}
                    <span style="font-size: 14px; color: var(--text);">${item.message || ''}</span>
                    ${item.image_url ? `<br><img src="${item.image_url}" style="max-width:100%; border-radius:8px; margin-top:8px;">` : ''}
                </div>
            `).join('');
        }

        document.addEventListener("DOMContentLoaded", loadAdminStatus);
    </script>
</body>
</html>
