<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Register - Smart Money</title>

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-card {
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
      text-align: center;
    }

    .auth-header h2 {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 5px;
    }

    .auth-header p {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 5px;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }

    .input-field:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }

    .input-field[readonly] {
      background: #f8fafc;
      color: #64748b;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #64748b;
    }

    .auth-footer a {
      color: #6366f1;
      font-weight: 600;
      text-decoration: none;
    }

    .ref-info {
      font-size: 11px;
      color: #16a34a;
      margin-top: 5px;
      display: none;
    }

  </style>
</head>

<body>

  <div class="auth-card" id="registerBox">

    <div class="auth-header">
      <h2>Create Account</h2>
      <p>Join Smart Money today</p>
    </div>


    <div class="input-group">
      <label>Full Name</label>

      <input
        type="text"
        id="regName"
        class="input-field"
        placeholder="Full name"
      >
    </div>


    <div class="input-group">
      <label>Email Address</label>

      <input
        type="email"
        id="regEmail"
        class="input-field"
        placeholder="Email address"
      >
    </div>


    <div class="input-group">
      <label>Password</label>

      <input
        type="password"
        id="regPassword"
        class="input-field"
        placeholder="Password"
      >
    </div>


    <div class="input-group">

      <label>Referral ID (Compulsory)</label>

      <input
        type="text"
        id="regReferral"
        class="input-field"
        placeholder="e.g. SM-smart12345"
      >

      <div
        class="ref-info"
        id="refInfo">
        ✓ Referral ID applied from link
      </div>

    </div>


    <button
      onclick="handleRegister()"
      class="btn-submit"
      id="regBtn">

      Register & Proceed

    </button>


    <div class="auth-footer">

      Already have an account?

      <a href="login.html">
        Login
      </a>

    </div>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    // =====================================================
    // SUPABASE CONFIG
    // =====================================================

    const SUPABASE_URL =
      "https://rvprrulkjegvicbnjuft.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_IdI5j4Q4qcd-1knRMVeGKw_O3Ek42ZJ";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    // =====================================================
    // AUTO FILL REFERRAL FROM URL
    //
    // Example:
    // register.html?ref=SM-smart88896
    // =====================================================

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const urlParams =
          new URLSearchParams(
            window.location.search
          );

        const refParam =
          urlParams.get("ref");


        if (refParam) {

          const referralInput =
            document.getElementById(
              "regReferral"
            );

          referralInput.value =
            refParam.trim();

          referralInput.readOnly =
            true;


          document.getElementById(
            "refInfo"
          ).style.display =
            "block";

        }

      }
    );


    // =====================================================
    // GENERATE UNIQUE REFERRAL CODE
    //
    // Format:
    // SM-smart12345
    // =====================================================

    async function generateUniqueReferralCode() {

      for (let attempt = 0; attempt < 20; attempt++) {

        const randomDigits =
          Math.floor(
            10000 +
            Math.random() * 90000
          );


        const referralCode =
          "SM-smart" + randomDigits;


        const {
          data,
          error
        } =
        await supabaseClient
          .from("profiles")
          .select("id")
          .eq(
            "referral_code",
            referralCode
          )
          .maybeSingle();


        if (error) {
          console.log(
            "Referral check error:",
            error
          );
        }


        // Agar code database me nahi hai
        // to use kar sakte hain
        if (!data) {
          return referralCode;
        }

      }


      throw new Error(
        "Unable to generate unique referral code. Please try again."
      );

    }


    // =====================================================
    // REGISTER USER
    // =====================================================

    async function handleRegister() {


      const name =
        document
          .getElementById("regName")
          .value
          .trim();


      const email =
        document
          .getElementById("regEmail")
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById("regPassword")
          .value
          .trim();


      const referral =
        document
          .getElementById("regReferral")
          .value
          .trim();


      const btn =
        document.getElementById(
          "regBtn"
        );


      // =====================================================
      // VALIDATION
      // =====================================================

      if (
        !name ||
        !email ||
        !password ||
        !referral
      ) {

        alert(
          "⚠️ Sabhi fields bharna zaroori hai!"
        );

        return;

      }


      if (password.length < 6) {

        alert(
          "⚠️ Password kam se kam 6 characters ka hona chahiye!"
        );

        return;

      }


      btn.innerText =
        "Processing...";

      btn.disabled =
        true;


      try {


        // =====================================================
        // 1. CHECK REFERRAL CODE
        // =====================================================

        const {
          data: refCheck,
          error: refError
        } =
        await supabaseClient
          .from("profiles")
          .select(
            "id, user_id, referral_code"
          )
          .eq(
            "referral_code",
            referral
          )
          .maybeSingle();


        if (refError) {

          throw new Error(
            "Referral verification failed: " +
            refError.message
          );

        }


        if (!refCheck) {

          throw new Error(
            "Invalid Referral ID!"
          );

        }


        // =====================================================
        // 2. SIGN UP USER
        // =====================================================

        const {
          data: authData,
          error: authError
        } =
        await supabaseClient
          .auth
          .signUp({

            email: email,

            password: password,

            options: {

              data: {

                full_name: name,

                referral_id: referral

              }

            }

          });


        if (authError) {

          throw authError;

        }


        const userId =
          authData?.user?.id;


        if (!userId) {

          throw new Error(
            "User account create nahi hua."
          );

        }


        // =====================================================
        // 3. CHECK IF PROFILE ALREADY EXISTS
        // =====================================================

        const {
          data: existingProfile,
          error: profileCheckError
        } =
        await supabaseClient
          .from("profiles")
          .select(
            "id"
          )
          .eq(
            "user_id",
            userId
          )
          .maybeSingle();


        if (profileCheckError) {

          throw new Error(
            profileCheckError.message
          );

        }


        // =====================================================
        // 4. GENERATE UNIQUE REFERRAL CODE
        // =====================================================

        const generatedRefCode =
          await generateUniqueReferralCode();


        // =====================================================
        // 5. INSERT PROFILE ONLY IF NOT EXISTS
        // =====================================================

        if (!existingProfile) {


          const {
            error: profileError
          } =
          await supabaseClient
            .from("profiles")
            .insert([{

              user_id:
                userId,

              full_name:
                name,

              email:
                email,

              referral_code:
                generatedRefCode,

              referred_by:
                referral,

              referral_id:
                referral,

              status:
                "PENDING",

              balance:
                0,

              is_active:
                false

            }]);


          if (profileError) {

            throw profileError;

          }

        }


        // =====================================================
        // SUCCESS SCREEN
        // =====================================================

        showPendingApprovalScreen(
          email,
          generatedRefCode
        );


      }
      catch (err) {


        console.error(
          "Registration Error:",
          err
        );


        alert(
          "Registration Failed: " +
          err.message
        );


        btn.innerText =
          "Register & Proceed";

        btn.disabled =
          false;

      }

    }


    // =====================================================
    // PENDING SCREEN
    // =====================================================

    function showPendingApprovalScreen(
      userEmail,
      userReferralCode
    ) {


      const card =
        document.getElementById(
          "registerBox"
        );


      card.innerHTML = `

        <h2 style="
          color:#0f172a;
          margin-bottom:15px;
        ">
          ⏳ Approval Pending
        </h2>


        <p style="
          font-size:13px;
          color:#64748b;
          margin:15px 0;
        ">

          Aapka account successfully create ho gaya hai.

          Admin approval ke baad
          aap login kar sakte hain.

        </p>


        <div style="
          background:#f1f5f9;
          padding:15px;
          border-radius:12px;
          margin:15px 0;
        ">

          <div style="
            font-size:12px;
            color:#64748b;
          ">
            Your Referral ID
          </div>


          <div style="
            font-size:18px;
            font-weight:800;
            color:#4f46e5;
            margin-top:5px;
          ">

            ${userReferralCode}

          </div>

        </div>


        <p style="
          font-size:12px;
          color:#94a3b8;
        ">

          Confirmation:
          ${userEmail}

        </p>


        <button
          onclick="window.location.href='login.html'"
          class="btn-submit"
          style="margin-top:20px;">

          Go to Login

        </button>

      `;

    }

  </script>

</body>
</html>
