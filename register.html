<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register - Smart Money</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">Smart Money</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
    </nav>
  </header>


  <main class="form-page">

    <div class="form-box">

      <h1>Create Account</h1>
      <p>Join Smart Money</p>


      <form id="registerForm">

        <!-- Full Name -->
        <label for="name">Full Name</label>

        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required
        >


        <!-- Email -->
        <label for="email">Gmail</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your Gmail"
          required
        >


        <!-- Mobile -->
        <label for="mobile">Mobile Number</label>

        <input
          type="tel"
          id="mobile"
          placeholder="Enter mobile number"
          required
        >


        <!-- Profile Photo -->
        <label for="photo">Profile Photo</label>

        <input
          type="file"
          id="photo"
          accept="image/*"
          required
        >


        <!-- Password -->
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Create password"
          required
        >


        <!-- Confirm Password -->
        <label for="confirmPassword">Confirm Password</label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm password"
          required
        >


        <!-- Referral -->
        <label for="referral">Referral ID</label>

        <input
          type="text"
          id="referral"
          placeholder="Enter referral ID (optional)"
        >


        <!-- Submit -->
        <button
          type="submit"
          class="btn register-btn"
          id="registerButton"
        >
          Create Account
        </button>

      </form>


      <p class="login-text">
        Already have an account?
        <a href="login.html">Login</a>
      </p>

    </div>

  </main>


  <!-- Supabase JavaScript Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    // ================================
    // SUPABASE CONNECTION
    // ================================

    const SUPABASE_URL =
      "https://rvprrulkjegvicbnjuft.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_IdI5j4Q4qcd-1knRMVeGKw_O3Ek42ZJ";


    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    // ================================
    // REGISTER FORM
    // ================================

    document
      .getElementById("registerForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();


        // Get form values
        const name =
          document.getElementById("name").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const mobile =
          document.getElementById("mobile").value.trim();

        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        const referral =
          document.getElementById("referral").value.trim();

        const photo =
          document.getElementById("photo").files[0];


        // ================================
        // PASSWORD CHECK
        // ================================

        if (password !== confirmPassword) {

          alert("Passwords do not match.");

          return;
        }


        // ================================
        // BUTTON
        // ================================

        const registerButton =
          document.getElementById("registerButton");

        registerButton.disabled = true;

        registerButton.textContent =
          "Creating Account...";


        try {

          // ================================
          // CREATE SUPABASE AUTH ACCOUNT
          // ================================

          const { data, error } =
            await supabaseClient.auth.signUp({

              email: email,

              password: password,

              options: {

                data: {
                  full_name: name,
                  mobile: mobile
                }

              }

            });


          // Auth error
          if (error) {

            throw error;

          }


          // ================================
          // USER CHECK
          // ================================

          const user = data.user;


          if (!user) {

            throw new Error(
              "Account could not be created."
            );

          }


          // ================================
          // SAVE PROFILE
          // ================================

          const { error: profileError } =
            await supabaseClient
              .from("profiles")
              .insert({

                user_id: user.id,

                full_name: name,

                email: email,

                mobile: mobile,

                referral_id: referral || null

              });


          // Profile error
          if (profileError) {

            throw profileError;

          }


          // ================================
          // SUCCESS
          // ================================

          alert(
            "Account created successfully!"
          );


          // Go to login page
          window.location.href =
            "login.html";


        } catch (error) {

          console.error(error);

          alert(
            "Registration failed: " +
            error.message
          );


        } finally {

          registerButton.disabled = false;

          registerButton.textContent =
            "Create Account";

        }

      });

  </script>

</body>
</html>
