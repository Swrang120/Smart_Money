<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Money - Complete Payment</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- EmailJS SDK CDN -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function() {
      emailjs.init("FxcimUvl0-ZxAauRx");
    })();
  </script>

  <!-- Tesseract.js CDN for Image OCR Text Extraction -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #f1f5f9; color: #1e293b; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .pay-card { background: #ffffff; width: 100%; max-width: 420px; padding: 25px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
    .pay-card h2 { margin-bottom: 5px; font-size: 20px; color: #7c3aed; }
    .price-tag { font-size: 24px; font-weight: 700; color: #10b981; margin: 10px 0; }
    .qr-img { width: 220px; height: 220px; object-fit: contain; border-radius: 12px; border: 2px dashed #cbd5e1; padding: 5px; margin: 15px auto; background: #f8fafc; }
    .upi-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 600; word-break: break-all; margin-bottom: 15px; color: #475569; }
    .form-group { text-align: left; margin-bottom: 15px; }
    .form-group label { font-size: 12px; font-weight: 600; color: #475569; display: block; margin-bottom: 5px; }
    .input-field { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 13px; outline: none; }
    .btn-submit { width: 100%; background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff; border: none; padding: 13px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3); }
    .btn-submit:hover { opacity: 0.9; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="pay-card">
  <h2>Complete Your Payment</h2>
  <p id="pkgSubTitle" style="font-size: 13px; color: #64748b;">Scan QR or use UPI ID to pay</p>
  
  <div class="price-tag" id="displayPackagePrice">₹289</div>

  <!-- BharatPe QR Code -->
  <img src="IMG_20260826_034524.jpg" alt="BharatPe QR Code" class="qr-img" id="qrImageElement">

  <div class="upi-box" id="upiIdText">
    BHARATPE2U0V0S7G2D90659@unitype
  </div>
  <button onclick="copyUpi()" style="background:none; border:none; color:#7c3aed; font-size:12px; font-weight:600; cursor:pointer; margin-top:-10px; margin-bottom:15px; display:block; margin-left:auto; margin-right:auto;">📋 Copy UPI ID</button>

  <form id="paymentForm" onsubmit="submitPaymentProof(event)">
    <div class="form-group">
      <label>Enter UTR / Transaction ID (12 Digits)</label>
      <input type="text" id="utrNumber" class="input-field" placeholder="e.g. 435261890123" maxlength="12" required>
    </div>

    <div class="form-group">
      <label>Upload Payment Screenshot</label>
      <input type="file" id="paymentScreenshot" class="input-field" accept="image/*" required>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Submit Payment Proof</button>
  </form>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Supabase Setup
  const SUPABASE_URL = "https://rvprrulkjegvicbnjuft.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_IdI5j4Q4qcd-1knRMVeGKw_O3Ek42ZJ";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  // SessionStorage se checkout data safely get karna
  const checkoutData = JSON.parse(sessionStorage.getItem('checkout_data') || '{}');

  const pkgName = checkoutData.name || 'Starter Package';
  const pkgPrice = checkoutData.price || '289';
  const refCode = checkoutData.ref || '';
  const fullName = checkoutData.fullname || '';
  const mobile = checkoutData.mobile || '';
  const email = checkoutData.email || '';
  const password = checkoutData.password || '';

  // Validation Check: Agar user bina checkout fill kiye aaya ho ya session expire hua ho
  if (!email || !mobile) {
    alert("⚠️ Session expired or invalid access. Please fill details again.");
    window.location.href = "checkout.html";
  }

  // UI par price aur package name dynamically dikhana
  document.getElementById('displayPackagePrice').innerText = `₹${pkgPrice}`;
  document.getElementById('pkgSubTitle').innerText = `${pkgName} ke liye payment karein`;

  function copyUpi() {
    navigator.clipboard.writeText("BHARATPE2U0V0S7G2D90659@unitype");
    alert("🎉 UPI ID Copied!");
  }

  async function submitPaymentProof(event) {
    event.preventDefault();
    const utr = document.getElementById("utrNumber").value.trim();
    const fileInput = document.getElementById("paymentScreenshot").files[0];
    const btn = document.getElementById("submitBtn");

    if (!utr || !fileInput) {
      alert("Please enter UTR and upload screenshot.");
      return;
    }

    // UTR 12 digits strict validation
    if (utr.length !== 12 || isNaN(utr)) {
      alert("⚠️ Invalid UTR! Transaction ID strictly 12 digits ki honi chahiye.");
      document.getElementById("utrNumber").focus();
      return;
    }

    if (!email || !fullName) {
      alert("⚠️ User details missing! Please go back and fill details again.");
      window.location.href = "checkout.html";
      return;
    }

    btn.innerText = "Scanning Screenshot (AI)...";
    btn.disabled = true;

    try {
      // Step 1: AI OCR Text Extraction from Screenshot
      const { data: { text } } = await Tesseract.recognize(fileInput, 'eng', {
        logger: m => console.log(m)
      });

      console.log("OCR Extracted Text:", text);

      // Clean text: remove all spaces, commas, and symbols to safely match the exact price digits
      const cleanText = text.replace(/[\s,₹Rs\.]/g, '');
      const rawTargetPrice = pkgPrice.toString().replace(/[\s,₹Rs\.]/g, '');

      console.log("Clean OCR Text:", cleanText);
      console.log("Looking for Price:", rawTargetPrice);

      const isAmountValid = cleanText.includes(rawTargetPrice);

      if (!isAmountValid) {
        alert(`⚠️ Amount Mismatch! Is package ka price ₹${pkgPrice} hai, lekin uploaded screenshot mein yeh amount match nahi ho raha hai. Kripya sahi screenshot upload karein.`);
        btn.innerText = "Submit Payment Proof";
        btn.disabled = false;
        return;
      }

      btn.innerText = "Uploading Proof...";

      // Step 2: Upload Screenshot to Supabase Storage bucket 'payment-proofs'
      const fileName = `${Date.now()}_${fileInput.name}`;
      const { data: uploadData, error: uploadError } = await supabaseClient.storage
        .from('payment-proofs')
        .upload(fileName, fileInput);

      if (uploadError) throw new Error("Screenshot upload failed: " + uploadError.message);

      // Get public URL of the uploaded image
      const { data: publicURL } = supabaseClient.storage
        .from('payment-proofs')
        .getPublicUrl(fileName);

      const screenshotUrl = publicURL.publicUrl;

      btn.innerText = "Submitting Order...";

      // Step 3: Save entry into payment_requests table with all collected details
      const { error: insertError } = await supabaseClient.from('payment_requests').insert([
        {
          full_name: fullName,
          email: email,
          mobile: mobile,
          password: password,
          package_name: pkgName,
          amount: Number(pkgPrice),
          transaction_id: utr,
          referral_id: refCode,
          screenshot_name: screenshotUrl,
          status: 'Pending',
          is_deleted: false
        }
      ]);

      if (insertError) throw insertError;

      // Successful insertion ke baad temporary session storage clear karein
      sessionStorage.removeItem('checkout_data');

      // Step 4: Send EmailJS Pending Verification Mail to User
      const emailParams = {
        to_name: fullName,
        to_email: email,
        utr_code: utr,
        package_name: pkgName
      };

      await emailjs.send("service_qsy07qr", "template_s9exuls", emailParams);

      alert("🎉 Payment proof submitted successfully! Admin verification ke baad aapka account activate kar diya jayega.");
      window.location.href = "index.html";

    } catch (err) {
      console.error("Full Error Details:", err);
      const errorMsg = err.message || err.text || (typeof err === 'string' ? err : JSON.stringify(err)) || "Unknown error occurred";
      alert("Error: " + errorMsg);
      btn.innerText = "Submit Payment Proof";
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
