<!-- =========================================================
SMART MONEY PAYMENT ADMIN PATCH
Paste this block immediately BEFORE </body> in your current admin.html.
It fixes:
1. screenshot_url / screenshot_name compatibility
2. Payment proof preview modal
3. Payment method display
4. Pending / Approved / Rejected filters
5. Approve / Reject actions
6. Old and new payment request records
========================================================= -->

<style>
.sm-proof-btn{background:rgba(14,165,233,.16);color:#7dd3fc}
.sm-method{display:inline-block;margin-top:6px;padding:4px 8px;border-radius:999px;background:rgba(99,102,241,.16);color:#c4b5fd;font-size:11px;font-weight:700}
.sm-proof-thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid rgba(255,255,255,.12);cursor:pointer;display:block}
.sm-proof-empty{font-size:11px;color:#94a3b8}
#smProofModal{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.82)}
#smProofModal.show{display:flex}
#smProofModal .sm-proof-box{width:min(920px,100%);max-height:92vh;overflow:auto;background:#111827;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px}
#smProofModal .sm-proof-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
#smProofModal .sm-proof-image{width:100%;max-height:72vh;object-fit:contain;border-radius:12px;background:#020617}
#smProofModal .sm-close{border:0;background:#1e293b;color:#fff;width:38px;height:38px;border-radius:10px;cursor:pointer}
</style>

<div id="smProofModal" onclick="if(event.target===this) closePaymentProof()">
  <div class="sm-proof-box">
    <div class="sm-proof-head">
      <div>
        <b id="smProofTitle">Payment Screenshot</b>
        <div id="smProofMeta" class="small"></div>
      </div>
      <button class="sm-close" onclick="closePaymentProof()">✕</button>
    </div>
    <img id="smProofImage" class="sm-proof-image" alt="Payment proof">
  </div>
</div>

<script>
(function(){
  function esc(v){
    return String(v ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }

  function statusKey(v){
    return String(v || "Pending").trim().toLowerCase();
  }

  function getProofUrl(p){
    return String(
      p?.screenshot_url ||
      p?.screenshot_name ||
      p?.screenshot ||
      p?.proof_url ||
      ""
    ).trim();
  }

  window.openPaymentProof = function(id){
    const p = (window.allPaymentsData || []).find(x => String(x.id) === String(id));
    if(!p){
      alert("Payment request not found.");
      return;
    }

    const url = getProofUrl(p);
    if(!url){
      alert("No payment screenshot URL is available for this request.");
      return;
    }

    document.getElementById("smProofTitle").textContent =
      (p.full_name || "User") + " — Payment Proof";

    document.getElementById("smProofMeta").textContent =
      "UTR: " + (p.transaction_id || p.payment_id || "N/A") +
      " • ₹" + (p.amount || 0) +
      " • " + (p.payment_method || "Payment method not recorded");

    const img = document.getElementById("smProofImage");
    img.src = url;
    img.onerror = function(){
      alert("The payment proof image could not be loaded. Check Storage public access or the saved URL.");
      closePaymentProof();
    };

    document.getElementById("smProofModal").classList.add("show");
  };

  window.closePaymentProof = function(){
    const modal = document.getElementById("smProofModal");
    modal.classList.remove("show");
    document.getElementById("smProofImage").src = "";
  };

  window.loadPaymentRequests = async function(){
    const {data, error} = await supabaseClient
      .from("payment_requests")
      .select("*")
      .or("is_deleted.eq.false,is_deleted.is.null")
      .order("created_at",{ascending:false});

    if(error) throw error;

    window.allPaymentsData = data || [];
    window.renderPayments();
    if(typeof updateGlobalStats === "function") updateGlobalStats();
  };

  window.renderPayments = function(){
    const tbody = document.getElementById("paymentTableBody");
    if(!tbody) return;

    const tab = window.currentPaymentTab || "all";
    const list = tab === "all"
      ? (window.allPaymentsData || [])
      : (window.allPaymentsData || []).filter(p => {
          const s = statusKey(p.status || p.payment_status || "Pending");
          return s === tab;
        });

    if(!list.length){
      tbody.innerHTML = '<tr><td colspan="5" class="empty">No payment requests found.</td></tr>';
      return;
    }

    tbody.innerHTML = list.map(p => {
      const user = typeof findUserForRequest === "function" ? findUserForRequest(p) : null;
      const status = p.status || p.payment_status || "Pending";
      const lower = statusKey(status);
      const proof = getProofUrl(p);
      const userName = p.full_name || user?.full_name || "User";
      const email = p.email || user?.email || "N/A";
      const userId = p.user_id || p.profile_id || user?.id || "N/A";
      const referral = p.referral_id || user?.referral_id || "N/A";
      const utr = p.transaction_id || p.payment_id || "N/A";
      const method = p.payment_method || "Not recorded";

      return `
        <tr>
          <td>
            <b>👤 ${esc(userName)}</b><br>
            <span class="small">📧 ${esc(email)}</span><br>
            <span class="small">🆔 ${esc(userId)}</span><br>
            <span class="small">🔗 ${esc(referral)}</span><br>
            <span class="sm-method">💳 ${esc(method)}</span>
          </td>

          <td>
            <b>${esc(p.package_name || p.package_type || "Package")}</b><br>
            <span style="color:#22c55e;font-weight:bold">₹${esc(p.amount ?? p.package_price ?? 0)}</span>
          </td>

          <td>
            <code>${esc(utr)}</code><br><br>
            ${
              proof
                ? `<img class="sm-proof-thumb" src="${esc(proof)}" alt="Payment proof" onclick="openPaymentProof('${esc(p.id)}')">`
                : `<span class="sm-proof-empty">No screenshot saved</span>`
            }
            <br>
            ${
              proof
                ? `<button class="btn sm-proof-btn" onclick="openPaymentProof('${esc(p.id)}')">View Proof</button>`
                : ""
            }
          </td>

          <td>
            <span class="badge badge-${esc(lower)}">${esc(status)}</span>
          </td>

          <td>
            ${
              lower === "pending"
                ? `
                  <button class="btn btn-approve" onclick="approvePayment('${esc(p.id)}')">Approve</button>
                  <button class="btn btn-reject" onclick="rejectPayment('${esc(p.id)}')">Reject</button>
                `
                : ""
            }
            <button class="btn btn-delete" onclick="softDeleteRecord('${esc(p.id)}','payment_requests')">Delete</button>
          </td>
        </tr>
      `;
    }).join("");
  };

  window.switchPaymentTab = function(tab, button){
    window.currentPaymentTab = tab;
    if(button && button.parentElement){
      button.parentElement.querySelectorAll(".filter-btn")
        .forEach(btn => btn.classList.remove("active"));
      button.classList.add("active");
    }
    window.renderPayments();
  };

  window.approvePayment = async function(id){
    if(!confirm("Approve this payment?")) return;

    const p = (window.allPaymentsData || []).find(x => String(x.id) === String(id));
    if(!p){
      alert("Payment request not found.");
      return;
    }

    try{
      const {error} = await supabaseClient
        .from("payment_requests")
        .update({status:"Approved", payment_status:"Approved"})
        .eq("id", id);

      if(error) throw error;

      const user = typeof findUserForRequest === "function" ? findUserForRequest(p) : null;
      const userId = p.user_id || p.profile_id || user?.id;

      if(userId){
        const payload = {
          is_active: true,
          package_name: p.package_name || p.package_type || user?.package_name || null
        };

        const {error: profileError} = await supabaseClient
          .from("profiles")
          .update(payload)
          .eq("id", userId);

        if(profileError) console.warn("Profile activation warning:", profileError.message);
      }

      alert("Payment approved successfully!");
      if(typeof refreshAllData === "function") await refreshAllData();
      else await loadPaymentRequests();

    }catch(error){
      console.error(error);
      alert("Approval failed: " + (error.message || "Unknown error"));
    }
  };

  window.rejectPayment = async function(id){
    if(!confirm("Reject this payment?")) return;

    try{
      const {error} = await supabaseClient
        .from("payment_requests")
        .update({status:"Rejected", payment_status:"Rejected"})
        .eq("id", id);

      if(error) throw error;

      alert("Payment rejected.");
      if(typeof refreshAllData === "function") await refreshAllData();
      else await loadPaymentRequests();

    }catch(error){
      console.error(error);
      alert(error.message || "Unable to reject payment.");
    }
  };
})();
</script>
