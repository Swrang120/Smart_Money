  async function sendRegistrationApprovalEmail(

    fullName,
    referralId,
    packageName
  ) {
    if (!email) return false;

    try {
      await emailjs.send(
        EMAIL_CONFIG.registration.serviceId,
        EMAIL_CONFIG.registration.templateId,
        {
          to_email: email,
          to_name: fullName || "User",
          user_name: fullName || "User",

          package_name: packageName || "",

  async function uploadAndSaveAdminLogo() {

    const fileInput =
      document.getElementById("adminLogoFileInput");

    const file = fileInput.files[0];

    if (!file) {
      alert("Pehle koi photo select karein!");
      return;
    }

    try {

      const fileName =
        "global_logo_" +
        Date.now() +
        "_" +
        file.name;

      const { error: uploadError } =
        await supabaseClient.storage
          .from("avatars")
          .upload(fileName, file);

      if (uploadError) {
        throw uploadError;
      }

      const { data: publicUrlData } =
        supabaseClient.storage
          .from("avatars")
          .getPublicUrl(fileName);

      const imageUrl =
        publicUrlData.publicUrl;

      const { error: dbError } =
        await supabaseClient
          .from("global_settings")
          .update({
            setting_value: imageUrl

          .eq(
            "setting_key",
            "admin_top_logo"

      }

      alert(

      fileInput.value = "";

        error.message
      );

          .from("payment_requests")
          .select("*")
          .order(

        (data || []).filter(
          item => item.is_deleted !== true

      updateStatsAndRenderPayments();

    } catch (error) {

  /* =========================================
     APPROVE PAYMENT
     NEW USER APPROVAL EMAIL
  ========================================== */

  async function approvePayment(
    id,
    fullName,
    email,
    packageName,
    refId
  ) {

    if (
      !confirm(
        `Approve package for ${fullName}?`
      )
    ) {
      return;
    }


    try {

      let randomNumbers = "";

      for (
        let i = 0;
        i < 5;
        i++
      ) {

        randomNumbers +=
          Math.floor(
            Math.random() * 10
          );

      }


      const uniqueRefCode =
        "SM-smart" +
        randomNumbers;


      const {
        error: insErr
      } =
        await supabaseClient
          .from("profiles")
          .insert([
            {
              full_name:
                fullName,

              email:
                email,

              package_name:
                packageName,

              referral_id:
                uniqueRefCode,

              referred_by:
                refId ||
                "SM-smart87046",

              balance:
                0,

              is_active:
                true
            }
          ]);


      if (insErr) {
        throw insErr;
      }


      const sponsorIdToUse =
        (
          refId &&
          refId !== "null" &&
          refId !== "N/A" &&
          refId !== ""
        )
          ? refId
          : "SM-smart87046";


      const {
        data: sponsor
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id, balance, package_name"
          )
          .eq(
            "referral_id",
            sponsorIdToUse
          )
          .maybeSingle();


      if (sponsor) {

        let comm = 280;

        const pkg =
          (
            packageName ||
            ""
          ).toLowerCase();


        if (
          pkg.includes("entry")
        ) {

          comm = 99.70;

        }

        else if (
          pkg.includes("growth")
        ) {

          comm = 539.40;

        }

        else if (
          pkg.includes("premium")
        ) {

          comm = 1049.30;

        }


        await supabaseClient
          .from("profiles")
          .update({
            balance:
              Number(
                sponsor.balance || 0
              ) +
              comm
          })
          .eq(
            "id",
            sponsor.id
          );

      }


      const {
        error: paymentError
      } =
        await supabaseClient
          .from("payment_requests")
          .update({
            status:
              "Approved"
          })
          .eq(
            "id",
            id
          );


      if (paymentError) {
        throw paymentError;
      }


      /* SEND NEW USER APPROVAL EMAIL */

      let emailStatus =
        false;

      if (email) {

        emailStatus =
          await sendRegistrationApprovalEmail(
            email,
            fullName,
            uniqueRefCode,
            packageName
          );

      }


      if (emailStatus) {

        alert(
          "Package Approved Successfully! 🎉\n\n" +
          "Referral ID: " +
          uniqueRefCode +
          "\n\nApproval Email Sent Successfully!"
        );

      } else {

        alert(
          "Package Approved Successfully! 🎉\n\n" +
          "Referral ID: " +
          uniqueRefCode +
          "\n\nEmail could not be sent. Please check EmailJS template variables."
        );

      }


      loadPaymentRequests();

      loadUsers();


    } catch (err) {

      console.error(err);

      alert(
        "Error: " +
        err.message
      );

    }

  }

      return;
    }


    try {

      const {
        error
      } =
        await supabaseClient
          .from("payment_requests")
          .update({
            status:

    } catch (err) {

      alert(

  }

                </button>
                `
                : ""
            }


            <button
            class="btn btn-delete"
            onclick="

  /* =========================================
     UPDATE WITHDRAWAL
     WITHDRAWAL APPROVED EMAIL
  ========================================== */

  async function updateWithdrawal(
    id,
    userId,
    amount,
    status,
    email,
    name
  ) {

    if (
      !confirm(
        `Are you sure to ${status} this withdrawal?`
      )
    ) {
      return;
    }


    try {

      const {
        error: updErr
      } =
        await supabaseClient
          .from("withdrawal_requests")
          .update({
            status:
              status
          })
          .eq(
            "id",
            id
          );


      if (updErr) {
        throw updErr;
      }


      /* REFUND IF REJECTED */

      if (
        status === "Rejected" &&
        userId
      ) {

        const {
          data: prof
        } =
          await supabaseClient
            .from("profiles")
            .select(
              "id, balance"
            )
            .eq(
              "id",
              userId
            )
            .maybeSingle();


        if (prof) {

          await supabaseClient
            .from("profiles")
            .update({

              balance:
                Number(
                  prof.balance ||
                  0
                ) +
                Number(
                  amount
                )

            })
            .eq(
              "id",
              prof.id
            );

        }

      }


      /* SEND WITHDRAWAL EMAIL */

      if (
        status === "Approved" &&
        email
      ) {

        const emailSent =
          await sendWithdrawalApprovedEmail(
            email,
            name,
            amount
          );


        if (emailSent) {

          alert(
            "Withdrawal Approved Successfully! 🎉\n\nApproval Email Sent Successfully!"
          );

        } else {

          alert(
            "Withdrawal Approved Successfully! 🎉\n\nBut email could not be sent."
          );

        }

      } else {

        alert(
          `Withdrawal ${status} successfully!`
        );

      }


      loadWithdrawals();


    } catch (err) {

      console.error(err);

      alert(
        "Error: " +
        err.message
      );

    }

  }


  /* =========================================
     SOFT DELETE RECORD
  ========================================== */

  async function softDeleteRecord(
    id,
    table
  ) {

    if (
      !confirm(
        "Move this record to trash?"
      )
    ) {
      return;
    }


    const {
      error
    } =
      await supabaseClient
        .from(table)
        .update({
          is_deleted:
            true
        })
        .eq(
          "id",
          id
        );


    if (!error) {

      alert(
        "Moved to trash successfully!"
      );


      if (
        table ===
        "payment_requests"
      ) {

        loadPaymentRequests();

      } else {

        loadWithdrawals();

      }

    } else {

      alert(
        "Error: " +
        error.message
      );

    }

  }

                  ? `
                  <button
                  class="
                  btn
                  ${
                    active
                      ? "btn-reject"
                      : "btn-approve"
                  }
                  "
                  onclick="
                  toggleUser(
                  '${recordId}',
                  ${!active}
                  )">

                    ${
                      active
                        ? "Block"
                        : "Unblock"
                    }

                  </button>

                  <button
                  class="btn btn-delete"
                  onclick="
                  softDeleteUser(
                  '${recordId}'
                  )">

                    Delete

                  </button>
                  `
                  : `
                  <span
                  style="
                  color:#34d399;
                  font-size:11px;
                  font-weight:700;
                  ">
                    Master Admin
                  </span>
                  `
              }

            </td>

          </tr>

        `;

      }
    );

  }


  /* =========================================
     BLOCK / UNBLOCK USER
  ========================================== */

  async function toggleUser(
    id,
    status
  ) {

    await supabaseClient
      .from("profiles")
      .update({
        is_active:
          status
      })
      .eq(
        "id",
        id
      );


    loadUsers();

  }


  /* =========================================
     DELETE USER
  ========================================== */

  async function softDeleteUser(id) {

    if (
      !confirm(
        "⚠️ Are you sure you want to delete this user account?"
      )
    ) {
      return;
    }


    const {
      error
    } =
      await supabaseClient
        .from("profiles")
        .update({
          is_deleted:
            true
        })
        .eq(
          "id",
          id
        );


    if (!error) {

      alert(
        "User account moved to trash successfully!"
      );

      loadUsers();

    } else {

      alert(
        "Error: " +
        error.message
      );

    }

  }


  /* =========================================
     TRASH & HISTORY
  ========================================== */

  async function loadTrashAndHistoryData() {

    const {
      data: historyPayments
    } =
      await supabaseClient
        .from("payment_requests")
        .select("*")
        .eq(
          "status",
          "Approved"
        )
        .order(
          "created_at",
          {
            ascending:
              false
          }
        );


    const hContainer =
      document.getElementById(
        "approvedHistoryList"
      );


    if (
      !historyPayments ||
      historyPayments.length === 0
    ) {

      hContainer.innerHTML =
        "No approved history yet.";

    } else {

      hContainer.innerHTML =
        historyPayments
          .map(
            payment => `
            <div
            style="
            background:rgba(255,255,255,0.03);
            padding:8px 10px;
            border-radius:8px;
            margin-bottom:6px;
            ">

              <b>
                ${
                  payment.full_name ||
                  "User"
                }
              </b>

              -

              <span
              style="
              color:#34d399;
              ">

                ₹${
                  payment.amount ||
                  0
                }

              </span>

            </div>
            `
          )
          .join("");

    }


    /* DELETED USERS */

    const {
      data: users
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
          "is_deleted",
          true
        );


    const uContainer =
      document.getElementById(
        "deletedUsersList"
      );


    if (
      !users ||
      users.length === 0
    ) {

      uContainer.innerHTML =
        "No deleted users.";

    } else {

      uContainer.innerHTML =
        users
          .map(
            user => `
            <div
            style="
            background:rgba(255,255,255,0.03);
            padding:8px;
            border-radius:8px;
            margin-bottom:6px;
            ">

              <b>
                ${
                  user.full_name ||
                  "User"
                }
              </b>

              <button
              class="btn btn-restore"
              onclick="
              restoreRecord(
              '${user.id}',
              'profiles'
              )">

                Restore

              </button>

            </div>
            `
          )
          .join("");

    }

  }


  /* =========================================
     RESTORE RECORD
  ========================================== */

  async function restoreRecord(
    id,
    table
  ) {

    if (
      !confirm(
        "Are you sure you want to restore this item?"
      )
    ) {
      return;
    }


    const {
      error
    } =
      await supabaseClient
        .from(table)
        .update({
          is_deleted:
            false
        })
        .eq(
          "id",
          id
        );


    if (!error) {

      alert(
        "Restored successfully!"
      );

      loadUsers();

      loadPaymentRequests();

      loadWithdrawals();

      loadTrashAndHistoryData();

    } else {

      alert(
        "Error restoring: " +
        error.message
      );

    }

  }

</script>
