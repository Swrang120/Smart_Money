<!-- =====================================
     SUPABASE SESSION CHECK & SMART REDIRECT FOR HOME PAGE
===================================== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://rvprrulkjegvicbnjuft.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_IdI5j4Q4qcd-1knRMVeGKw_O3Ek42ZJ";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  document.addEventListener("DOMContentLoaded", async function () {
    const { data: { session } } = await supabaseClient.auth.getSession();
    const loginLink = document.getElementById("navLoginBtn");
    const navContainer = document.querySelector(".navbar nav");

    if (session) {
      // Agar user logged in hai, toh Login button ko "Dashboard" bana do
      if (loginLink) {
        loginLink.innerText = "Dashboard";
        loginLink.href = "dashboard.html";
      }

      // "My Account" button add kar do navbar mein
      const profileLink = document.createElement("a");
      profileLink.href = "dashboard.html";
      profileLink.innerText = "My Account";
      profileLink.style.background = "#7c3aed";
      profileLink.style.color = "#fff";
      profileLink.style.padding = "6px 12px";
      profileLink.style.borderRadius = "8px";
      profileLink.style.marginLeft = "8px";
      
      if (navContainer) {
        navContainer.appendChild(profileLink);
      }

      // 🔥 SMART REDIRECT: Agar user logged in hai, toh saare package/buy buttons click hone par dashboard kholenge
      const packageLinks = document.querySelectorAll('.package, .buttons .btn');
      packageLinks.forEach(link => {
        // Agar link anchor tag (#about ya #contact) nahi hai, toh redirect handle karo
        const href = link.getAttribute('href');
        if (href && (href.includes('register.html') || href.includes('.html') || href.includes('#packages'))) {
          link.addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = "dashboard.html";
          });
        }
      });
    }
  });

  const supportForm = document.getElementById("supportForm");
  if (supportForm) {
    supportForm.addEventListener("submit", function(event) {
      event.preventDefault();
      alert("Thank you! Your message has been received.");
      supportForm.reset();
    });
  }
</script>
