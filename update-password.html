<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Money - Create New Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;}
body{margin:0;background:#eef2f7;color:#1e293b;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.box{width:100%;max-width:400px;background:#ffffff;padding:30px;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.08);border:1px solid #e2e8f0;}
h2{margin-top:0;color:#0f172a;font-weight:800;}
p{font-size:13px;color:#64748b;margin-bottom:20px;}
.input-field{width:100%;padding:12px;border-radius:10px;border:1px solid #cbd5e1;margin:6px 0 16px;outline:none;font-size:14px;}
.btn-action{width:100%;padding:13px;border:none;border-radius:10px;color:#fff;font-weight:750;cursor:pointer;background:linear-gradient(135deg,#7c3aed,#6d28d9);font-size:14px;}
</style>
</head>
<body>

<div class="box">
  <h2>Create New Password</h2>
  <p id="statusMsg">Verifying reset link...</p>
  
  <div id="passwordFormDiv" style="display:none;">
    <label style="font-size:13px;font-weight:700;color:#475569;">New Password</label>
    <input type="password" id="newPassword" class="input-field" placeholder="At least 6 characters">

    <label style="font-size:13px;font-weight:700;color:#475569;">Confirm New Password</label>
    <input type="password" id="confirmPassword" class="input-field" placeholder="Re-enter new password">
    
    <button onclick="saveNewPassword()" class="btn-action" id="updateBtn">Update Password</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://rvprrulkjegvicbnjuft.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_IdI5j4Q4qcd-1knRMVeGKw_O3Ek42ZJ";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

document.addEventListener("DOMContentLoaded", async function(){
  const statusMsg = document.getElementById("statusMsg");
  const formDiv = document.getElementById("passwordFormDiv");

  // Supabase URL hash ya query se session detect karega
  setTimeout(() => {
    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      if (event === "PASSWORD_RECOVERY" || session) {
        statusMsg.innerText = "Link verified successfully! Please enter your new password.";
        statusMsg.style.color = "#10b981";
        formDiv.style.display = "block";
      } else {
        // Agar session nahi mila, toh check karein ki kya direct URL mein error hai
        statusMsg.innerText = "Invalid or expired link. Please request a new password reset link.";
        statusMsg.style.color = "#ef4444";
      }
    });
  }, 1000);
});

async function saveNewPassword() {
  const newPass = document.getElementById("newPassword").value.trim();
  const confirmPass = document.getElementById("confirmPassword").value.trim();
  const btn = document.getElementById("updateBtn");

  if(!newPass || newPass.length < 6){
    alert("Password must be at least 6 characters long!");
    return;
  }

  if(newPass !== confirmPass){
    alert("New Password and Confirm Password do not match!");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Updating...";

  try {
    const { error } = await supabaseClient.auth.updateUser({ password: newPass });
    if (error) throw error;

    alert("Password updated successfully! Please login with your new password.");
    window.location.href = "login.html";

  } catch (err) {
    alert("Error: " + err.message);
    btn.disabled = false;
    btn.innerText = "Update Password";
  }
}
</script>
</body>
</html>
