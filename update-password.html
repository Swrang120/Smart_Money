<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Money - Create New Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#ffffff;
  background: radial-gradient(circle at 15% 10%, rgba(124,58,237,.30), transparent 40%),
              radial-gradient(circle at 85% 80%, rgba(59,130,246,.20), transparent 40%),
              linear-gradient(135deg, #080a12, #111426, #080a12);
}
.box{
  width:100%;
  max-width:430px;
  background:rgba(17,19,28,.96);
  padding:35px 30px;
  border-radius:24px;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 20px 60px rgba(0,0,0,.65);
}
.brand{text-align:center;font-size:22px;font-weight:800;color:#ffffff;margin-bottom:25px;text-shadow:0 0 15px rgba(168,85,247,.55);}
.success-icon{width:60px;height:60px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);}
h2{margin:0 0 10px;text-align:center;font-size:22px;font-weight:800;}
#statusMsg{text-align:center;font-size:13px;color:#9ca3af;line-height:1.6;margin-bottom:25px;}
.form-group{margin-bottom:18px;}
label{display:block;font-size:12px;font-weight:700;color:#c4b5fd;margin-bottom:8px;}
.input-field{
  width:100%;
  padding:14px 15px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);
  color:#ffffff;
  outline:none;
  font-size:14px;
  transition:.25s;
}
.input-field::placeholder{color:#6b7280;}
.input-field:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.12);}
.password-info{font-size:11px;color:#6b7280;margin-top:-8px;margin-bottom:20px;line-height:1.5;}
.btn-action{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  color:#ffffff;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(135deg, #7c3aed, #6d28d9);
  font-size:14px;
  box-shadow:0 8px 22px rgba(124,58,237,.35);
  transition:.2s;
}
.btn-action:hover{opacity:.92;transform:translateY(-1px);}
.btn-action:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.back-link{display:block;text-align:center;margin-top:20px;font-size:13px;color:#a78bfa;text-decoration:none;font-weight:700;}
.back-link:hover{text-decoration:underline;}
#passwordFormDiv{display:none;}
</style>
</head>
<body>

<div class="box">
  <div class="brand">💎 SMART MONEY</div>
  <div class="success-icon">🔐</div>
  <h2>Create New Password</h2>
  <p id="statusMsg">Verifying your secure reset link...</p>

  <div id="passwordFormDiv">
    <div class="form-group">
      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" class="input-field" placeholder="Enter new password" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirm New Password</label>
      <input type="password" id="confirmPassword" class="input-field" placeholder="Re-enter new password" autocomplete="new-password">
    </div>
    <div class="password-info">Password must be at least 6 characters long.</div>
    <button onclick="saveNewPassword()" class="btn-action" id="updateBtn">Update Password</button>
  </div>

  <a href="login.html" class="back-link">← Back to Login</a>
</div>

<!-- SUPABASE JS SDK ONLY -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://rvprrulkjegvicbnjuft.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_IdI5j4Q4qcd-1knRMVeGKw_O3Ek42ZJ";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

let recoveryVerified = false;

function showPasswordForm() {
  recoveryVerified = true;
  const statusMsg = document.getElementById("statusMsg");
  const formDiv = document.getElementById("passwordFormDiv");

  statusMsg.innerText = "✓ Link verified successfully! Please enter your new password below.";
  statusMsg.style.color = "#86efac";
  formDiv.style.display = "block";
}

function showInvalidMessage() {
  if (!recoveryVerified) {
    const statusMsg = document.getElementById("statusMsg");
    statusMsg.innerText = "Invalid or expired reset link. Please request a new password reset link.";
    statusMsg.style.color = "#fca5a5";
  }
}

document.addEventListener("DOMContentLoaded", async function() {
  // Listen for Supabase password recovery session in URL
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if ((event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") && session) {
      showPasswordForm();
    }
  });

  // Fallback Session Check
  try {
    const { data } = await supabaseClient.auth.getSession();
    if (data && data.session) {
      showPasswordForm();
    } else {
      setTimeout(showInvalidMessage, 2000);
    }
  } catch (err) {
    console.error("Recovery verification error:", err);
    setTimeout(showInvalidMessage, 2000);
  }
});

async function saveNewPassword() {
  const newPass = document.getElementById("newPassword").value.trim();
  const confirmPass = document.getElementById("confirmPassword").value.trim();
  const btn = document.getElementById("updateBtn");

  if (!recoveryVerified) {
    alert("Please use a valid password recovery link sent to your email.");
    return;
  }
  if (!newPass || newPass.length < 6) {
    alert("Password must be at least 6 characters long!");
    return;
  }
  if (newPass !== confirmPass) {
    alert("New Password and Confirm Password do not match!");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Updating Password...";

  try {
    // Pure Supabase Password Update
    const { error } = await supabaseClient.auth.updateUser({ password: newPass });
    if (error) throw error;

    alert("🎉 Password updated successfully! Redirecting to login page...");

    await supabaseClient.auth.signOut();
    window.location.href = "login.html";

  } catch (error) {
    console.error("Password Update Error:", error);
    alert("Error: " + (error.message || "Failed to update password. Please try again."));
    btn.disabled = false;
    btn.innerText = "Update Password";
  }
}

document.getElementById("confirmPassword").addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    event.preventDefault();
    saveNewPassword();
  }
});
</script>
</body>
</html>
